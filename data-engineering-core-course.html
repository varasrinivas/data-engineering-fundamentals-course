<text x="600" y="40" text-anchor="middle" font-family="JetBrains Mono" font-size="12.5" fill="#5C5347" font-weight="700">clustered by customer_id inside</text>
<rect x="470" y="60" width="260" height="200" rx="10" fill="#FFFDF8" stroke="#0F6B5C" stroke-width="2"/>
<rect x="490" y="80" width="220" height="34" rx="6" fill="#E3EFEB"/><text x="600" y="102" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#0F6B5C">A100–C999</text>
<rect x="490" y="122" width="220" height="34" rx="6" fill="#FBF3DC" stroke="#C9A227" stroke-width="2" class="pulse"/><text x="600" y="144" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#A2831F" font-weight="700">D100–F999 ← your row block</text>
<rect x="490" y="164" width="220" height="34" rx="6" fill="#E3EFEB"/><text x="600" y="186" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#0F6B5C">G100–K999</text>
<rect x="490" y="206" width="220" height="34" rx="6" fill="#E3EFEB"/><text x="600" y="228" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#0F6B5C">L100–Z999</text>
</svg>`,
body:`<p><strong>Partitioning</strong> physically splits a table into segments by a column (usually date). Queries filtering on that column read only matching partitions — <em>partition pruning</em>. It also makes lifecycle easy: drop or archive old partitions cheaply.</p>
<p><strong>Clustering / bucketing</strong> sorts or co-locates data <em>within</em> partitions by high-cardinality columns (customer_id), so engines skip blocks via min/max stats. BigQuery pairs partition (date) + cluster (ids); Snowflake uses cluster keys; Databricks uses Z-ORDER or liquid clustering.</p>
<p><strong>Indexes</strong> are exact row lookups — the OLTP workhorse (B-trees). Warehouses mostly skip traditional indexes and rely on pruning + block statistics instead.</p>`,
concepts:[
 {t:'Choose partition keys by query pattern', d:'Partition by what 90% of queries filter on — almost always event date. A partition column nobody filters on is dead weight.'},
 {t:'Cardinality rules', d:'Partition = low cardinality (dates, regions). Cluster = high cardinality (user_id). Partitioning by user_id creates millions of tiny partitions — the small-files problem in disguise.'},
 {t:'Data skew', d:'If one partition holds 80% of data (one hot customer, one busy day), parallel workers sit idle while one struggles. Fix with better keys, salting, or composite keys.'},
 {t:'Pruning must be provable', d:'Wrapping the partition column in a function — WHERE CAST(dt AS STRING) LIKE… — can defeat pruning. Filter on the raw partition column.'}
],
qa:[
 {q:'How do you decide the partitioning strategy for a large table?', a:'Start from query patterns: partition on the column most queries filter by, almost always event date for fact tables. Check cardinality — aim for partitions that are neither too many (small-files, metadata bloat) nor too few (no pruning benefit); daily partitions of 1GB+ are a healthy shape. Then add clustering on high-cardinality filter/join columns like customer_id. Finally validate with query plans that pruning actually happens.', say:'"Partition by the question people ask most, cluster by the question they ask next."'},
 {q:'What is data skew and how do you handle it?', a:'Skew is uneven distribution across partitions or join keys — one hot key (a whale customer, a NULL) makes one worker process most of the data while others idle, so the job runs as slow as its worst partition. Fixes: salting hot keys (append a random suffix, aggregate in two passes), broadcast joins for small tables, filtering NULLs before joins, or choosing a more uniform partition key.', say:'"A car park where every car crowds one floor — the floor count doesn\'t matter if everyone parks on Level 2."'},
 {q:'Why don\'t data warehouses use indexes like OLTP databases?', a:'B-tree indexes accelerate finding individual rows, but analytical queries scan and aggregate millions — maintaining per-row indexes during bulk loads would cost more than it saves. Warehouses instead use coarse structures: partition pruning, per-block min/max statistics (zone maps), and clustering, which skip large chunks at scan time with almost no write penalty.', say:'"OLTP needs the attendant\'s ledger for one car; OLAP just needs floor signs to skip nine floors out of ten."'},
 {q:'A dashboard query on a 5TB table is slow and expensive. Walk me through fixing it.', a:'First inspect the query plan: is it full-scanning? Check that filters hit the partition column directly (no functions wrapping it). If the table isn\'t partitioned/clustered on the filter columns, restructure it. Then reduce work: pre-aggregate into a Gold summary table or materialized view for the dashboard, since BI tools re-run the same shape repeatedly. Finally check the small-files/skew angle and compact if needed.', say:'"Cheapest query is the one that reads less: prune first, pre-aggregate second, scale up last."'}
],
oneLiner:'Big data isn\'t slow — unorganized data is. Partition to skip floors, cluster to skip rows, and let the engine walk straight to the right parking slot.',
pitfalls:['Suggesting partitioning by a high-cardinality column like user_id — a classic trap question.','Forgetting that functions on the partition column in WHERE clauses can break pruning.']
},

/* ================= 08 SCD ================= */
{
id:'scd', num:'08', track:'tmodel',
title:'Slowly Changing Dimensions',
tagline:'Your bank knows your current address — and every address you\'ve ever had.',
analogy:{label:'Real-world analogy · The Address History',
text:'You move houses and update the bank. If they <strong>scribble over the old address</strong>, they\'ve lost where they mailed last year\'s statement — that\'s <strong>SCD Type 1</strong> (overwrite). If instead they <strong>add a new line</strong> — "old address valid 2019–2024, new address from 2024, current" — they can answer both "where do you live?" and "where did you live when this loan was issued?" That\'s <strong>SCD Type 2</strong> (history rows). Analytics usually needs the second, because facts must join to the dimension <em>as it was then</em>.'},
stage:`<svg viewBox="0 0 800 300" role="img" aria-label="SCD Type 1 versus Type 2 comparison">
<rect width="800" height="300" fill="#FFFDF8"/>
<text x="200" y="42" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#A34E3F" font-weight="700">TYPE 1 · overwrite</text>
<rect x="70" y="70" width="260" height="40" rx="8" fill="#FBEFEA" stroke="#A34E3F" stroke-width="1.5"/>
<text x="200" y="95" text-anchor="middle" font-size="11.5" font-family="JetBrains Mono" fill="#6E4437">C101 · <tspan text-decoration="line-through">Hyderabad</tspan> → Pune</text>
<text x="200" y="140" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#A34E3F" class="blink">history lost ✕</text>
<text x="580" y="42" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#3E7C4F" font-weight="700">TYPE 2 · add row</text>
<rect x="440" y="70" width="300" height="40" rx="8" fill="#EFEDE6" stroke="#9BA3AD" stroke-width="1.5"/>
<text x="590" y="95" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#5C5347">C101 · Hyderabad · 2019→2024 · ✕</text>
<rect x="440" y="120" width="300" height="40" rx="8" fill="#EAF3EC" stroke="#3E7C4F" stroke-width="2.5" class="pulse"/>
<text x="590" y="145" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#2E5E3C" font-weight="700">C101 · Pune · 2024→null · current ✓</text>
<text x="590" y="190" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#3E7C4F">full history kept ✓</text>
<path d="M400 230 q 60 30 120 0" stroke="#8A7F6F" stroke-width="2" fill="none" stroke-dasharray="5 5" class="dotflow"/>
<text x="400" y="270" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#8A7F6F">facts join to the version valid at event time</text>
</svg>`,
body:`<p>Dimensions (customer, product, branch) change slowly over time, and how you record changes determines what history your analytics can reconstruct.</p>
<p><strong>Type 0</strong>: never change (date dimension). <strong>Type 1</strong>: overwrite — simplest, but history is gone; fine for typo fixes. <strong>Type 2</strong>: insert a new row per change with <span class="mono">effective_from / effective_to / is_current</span> and a <strong>surrogate key</strong> per version — the analytics workhorse. <strong>Type 3</strong>: extra column holding previous value — only one change deep, rarely used.</p>
<p>Type 2 is why surrogate keys exist: the fact table stores the surrogate key of the version that was current at transaction time, freezing the historical context into every fact row.</p>`,
concepts:[
 {t:'Surrogate vs natural key', d:'Natural key = business id (C101). Surrogate key = per-version warehouse id. Type 2 needs surrogates because one customer maps to many rows.'},
 {t:'The three bookkeeping columns', d:'effective_from, effective_to (null/9999 for open), is_current flag. Closing the old row and inserting the new one happens in one MERGE.'},
 {t:'As-was vs as-is reporting', d:'Type 2 answers both: join facts on surrogate key for as-was; filter is_current for as-is. Type 1 can only ever answer as-is.'},
 {t:'Cost of Type 2', d:'Row count grows with change rate. For rapidly changing attributes (e.g., a score updated hourly), split them out (mini-dimension) instead of exploding the main one.'}
],
qa:[
 {q:'Explain SCD Type 1 vs Type 2. Which do you default to?', a:'Type 1 overwrites the attribute — simple, no history, right for corrections. Type 2 inserts a new versioned row with effective dates and a current flag, preserving full history so facts can join to the dimension as it existed at event time. I default to Type 2 for analytically meaningful attributes (segment, region, plan) and Type 1 for corrections and irrelevant fields — often both patterns per table, column by column.', say:'"Type 1 scribbles over the address; Type 2 adds a line to the address history."'},
 {q:'Why do we need surrogate keys in Type 2 dimensions?', a:'Because the natural key no longer identifies a unique row — customer C101 has one row per version. The surrogate key identifies a specific version, and fact tables store it at load time, permanently binding each fact to the dimension state that was true when the event occurred. It also insulates the warehouse from source-system key changes and collisions across sources.', say:'"The natural key names the person; the surrogate key names the person-at-a-point-in-time."'},
 {q:'How do you implement SCD Type 2 in SQL?', a:'A MERGE against the dimension using the natural key: when matched and tracked attributes changed → close the current row (set effective_to = now, is_current = false) and insert a new row (effective_from = now, is_current = true, new surrogate key); when not matched → insert. In practice: dbt snapshots, Delta MERGE, or BigQuery MERGE handle this pattern, driven by CDC or daily extracts.', say:'"One MERGE: expire the old version, insert the new one — atomically."'},
 {q:'Sales report by "customer region" changed retroactively after a customer moved. What went wrong?', a:'Classic Type 1 symptom: the dimension was overwritten, so historical facts now join to the new region and past months\' numbers silently shifted. Fix by converting region to a Type 2 attribute and joining facts on the surrogate key (or effective date range) so each sale keeps the region that was true when it happened.', say:'"If history changes when a customer moves, your dimension forgot to keep a diary."'}
],
oneLiner:'Facts are frozen events; dimensions drift. Type 2 keeps a dated diary of every drift so yesterday\'s report still tells yesterday\'s truth.',
pitfalls:['Mixing up Type 2 and Type 3 — Type 3 is the "previous_value column" one, and it only holds one change.','Forgetting surrogate keys — interviewers use this to separate memorized answers from understood ones.']
}
);

/* ================= 09 CDC ================= */
{
id:'cdc', num:'09', track:'t3',
title:'Change Data Capture (CDC)',
tagline:'Don\'t photocopy the whole ledger every night — just read the carbon copies of new entries.',
analogy:{label:'Real-world analogy · The Shop Ledger',
text:'A shopkeeper\'s accountant needs the day\'s business. Option 1: <strong>photocopy the entire ledger</strong> every night — all 10,000 pages, even though only 40 changed (full extract: slow, heavy, and you still can\'t tell what changed). Option 2: the ledger has <strong>carbon paper</strong> — every new or corrected entry automatically makes a copy the accountant collects (CDC: read the change stream). Databases already keep this carbon copy: the <strong>transaction log</strong>.'},
stage:`<svg viewBox="0 0 800 280" role="img" aria-label="CDC from transaction log to warehouse">
<rect width="800" height="280" fill="#FFFDF8"/>
<rect x="50" y="80" width="170" height="110" rx="12" fill="#E3EFEB" stroke="#0F6B5C" stroke-width="2.5"/>

<text x="695" y="65" text-anchor="middle" font-family="JetBrains Mono" font-size="12.5" fill="#0F6B5C" font-weight="700">lakehouse</text>

<circle cx="290" cy="220" r="7" fill="#3E7C4F" class="pulse"/><text x="310" y="225" font-size="10.5" font-family="JetBrains Mono" fill="#5C5347">INSERT</text>
<circle cx="400" cy="220" r="7" fill="#C9A227" class="pulse" style="animation-delay:.4s"/><text x="420" y="225" font-size="10.5" font-family="JetBrains Mono" fill="#5C5347">UPDATE (before/after)</text>
<circle cx="600" cy="220" r="7" fill="#A34E3F" class="pulse" style="animation-delay:.8s"/><text x="620" y="225" font-size="10.5" font-family="JetBrains Mono" fill="#5C5347">DELETE</text>
</svg>`,
body:`<p><strong>CDC</strong> captures inserts, updates, and deletes from a source database and delivers them as an ordered event stream, instead of re-extracting whole tables.</p>
<p>Three approaches, weakest to strongest: <strong>query-based</strong> (poll WHERE updated_at > last_run — simple, but misses deletes and needs a reliable timestamp column), <strong>trigger-based</strong> (database triggers write to an audit table — catches everything but slows source writes), and <strong>log-based</strong> (read the database\'s own transaction log — WAL in Postgres, binlog in MySQL — via tools like <strong>Debezium</strong>, Datastream, or Fivetran: near-zero source impact, captures deletes, preserves order). Log-based is the modern default; events typically flow through Kafka/PubSub and are MERGEd into lakehouse tables.</p>`,
concepts:[
 {t:'Deletes are the litmus test', d:'Full extracts and updated_at polling can\'t see deleted rows. If the interviewer asks "how do you sync deletes?", the answer is log-based CDC (or soft deletes).'},
 {t:'Initial snapshot + stream', d:'CDC pipelines start with a one-time full snapshot, then apply the change stream from that exact log position — the classic bootstrap pattern.'},
 {t:'Ordering per key', d:'Applying an UPDATE before its INSERT corrupts data. Partition the stream by primary key so each key\'s events stay in order.'},
 {t:'CDC feeds SCD', d:'The change events are exactly the input a Type 2 dimension MERGE needs — CDC and SCD are two halves of one story.'}
],
qa:[
 {q:'What is CDC and why prefer it over nightly full loads?', a:'CDC captures row-level inserts/updates/deletes from a source — ideally by reading its transaction log — and streams them to targets. Versus full loads: it moves only the delta (a fraction of the volume), reduces source load, cuts latency from a day to seconds, and crucially captures deletes, which full-table comparisons handle poorly. The tradeoff is more moving parts: connectors, a message bus, and merge logic.', say:'"Read the carbon copies, don\'t photocopy the ledger."'},
 {q:'Compare log-based CDC with query-based (timestamp) CDC.', a:'Query-based polls the table for rows with updated_at greater than the last watermark: easy, no special access, but it misses deletes, misses intermediate updates between polls, depends on the app maintaining the timestamp, and adds query load. Log-based taps the database\'s WAL/binlog: captures every change including deletes in commit order with negligible source impact, but needs elevated permissions, log retention configuration, and a connector like Debezium.', say:'"Polling asks the shopkeeper \'anything new?\'; log-based reads his own ledger as he writes it."'},
 {q:'How do you apply a CDC stream into an analytics table?', a:'Land events into a Bronze append-only table, then periodically MERGE into a Silver mirror: latest event per key wins (deduplicate by key + log sequence number), INSERT/UPDATE applies the after-image, DELETE removes or soft-deletes the row. Table formats matter here — Delta/Iceberg make the MERGE atomic. For history, feed the same stream into an SCD Type 2 dimension.', say:'"Append everything to Bronze, then MERGE the latest state per key into Silver."'},
 {q:'What can go wrong in a CDC pipeline?', a:'Out-of-order events per key (fix: partition by primary key, dedupe by log position), source schema changes breaking the contract (fix: schema registry and evolution rules), log retention expiring before a lagging consumer catches up (forces a re-snapshot), duplicate delivery on retries (fix: idempotent MERGE), and the initial snapshot/stream handoff missing or double-counting a window.', say:'"CDC failures are ordering, schema drift, retention, and duplicates — I design for all four upfront."'}
],
oneLiner:'The database already writes a diary of every change — CDC just reads the diary instead of rescanning the whole book every night.',
pitfalls:['Proposing updated_at polling and stopping there — the follow-up "what about deletes?" is nearly guaranteed.','Ignoring the initial snapshot problem — a stream without a starting snapshot mirrors nothing.']
},

/* ================= 10 Idempotency ================= */
{
id:'idempotency', num:'10', track:'t4',
title:'Idempotency, Exactly-Once & Backfills',
tagline:'A lift button pressed five times still calls one lift.',
analogy:{label:'Real-world analogy · The Lift Button',
text:'Press the lift button once or five times — <strong>one lift arrives</strong>. The button is <em>idempotent</em>: repeating the action doesn\'t multiply the effect. Compare a payment \'Pay\' button that charges you every time you nervously tap it. Pipelines fail and retry constantly, so every job must behave like the lift button: <strong>running it twice must give the same result as once</strong> — no duplicated rows, no double-counted revenue.'},
stage:`<svg viewBox="0 0 800 280" role="img" aria-label="Idempotent versus non-idempotent pipeline run">
<rect width="800" height="280" fill="#FFFDF8"/>
<text x="200" y="40" text-anchor="middle" font-family="JetBrains Mono" font-size="12.5" fill="#A34E3F" font-weight="700">naive INSERT · run twice</text>
<rect x="90" y="60" width="220" height="36" rx="7" fill="#FBEFEA" stroke="#A34E3F"/><text x="200" y="83" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#6E4437">run 1 → +1,000 rows</text>
<rect x="90" y="104" width="220" height="36" rx="7" fill="#FBEFEA" stroke="#A34E3F" class="pulse"/><text x="200" y="127" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#6E4437">retry → +1,000 AGAIN</text>
<text x="200" y="172" text-anchor="middle" font-size="12" font-family="JetBrains Mono" fill="#A34E3F" class="blink">2,000 rows · revenue doubled ✕</text>
<text x="590" y="40" text-anchor="middle" font-family="JetBrains Mono" font-size="12.5" fill="#3E7C4F" font-weight="700">overwrite partition · run twice</text>
<rect x="480" y="60" width="220" height="36" rx="7" fill="#EAF3EC" stroke="#3E7C4F"/><text x="590" y="83" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#2E5E3C">run 1 → dt=07-08 written</text>
<rect x="480" y="104" width="220" height="36" rx="7" fill="#EAF3EC" stroke="#3E7C4F" class="pulse"/><text x="590" y="127" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#2E5E3C">retry → dt=07-08 replaced</text>
<text x="590" y="172" text-anchor="middle" font-size="12" font-family="JetBrains Mono" fill="#3E7C4F">1,000 rows · same answer ✓</text>
<circle cx="400" cy="225" r="16" fill="none" stroke="#0F6B5C" stroke-width="3" class="pulse"/>
<circle cx="400" cy="225" r="6" fill="#0F6B5C"/>
<text x="400" y="265" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#5C5347">the lift button: press N times, one lift</text>
</svg>`,
body:`<p>Distributed systems retry: networks blip, workers die, schedulers re-run. <strong>Idempotency</strong> means re-execution is safe. The core patterns:</p>
<p><strong>Overwrite, don\'t append</strong> — write output as INSERT OVERWRITE / replace of a deterministic partition (the run\'s date), so reruns replace instead of duplicate. <strong>MERGE on keys</strong> — upsert by business key so replays update in place. <strong>Delete-then-insert</strong> for the target window. <strong>Deterministic logic</strong> — avoid CURRENT_TIMESTAMP-dependent output; parameterize the run by its logical date so today\'s rerun of yesterday\'s job produces yesterday\'s answer.</p>
<p><strong>Exactly-once</strong> in streaming is really <em>effectively-once</em>: at-least-once delivery + idempotent/transactional writes (checkpointing + transactional sinks in Flink/Kafka). <strong>Backfills</strong> — reprocessing history after logic changes — are only safe because jobs are idempotent and parameterized by logical date.</p>`,
concepts:[
 {t:'Logical date ≠ run date', d:'Airflow\'s execution/logical date parameterizes which data slice a run owns. Rerunning "July 8\'s job" on July 20 must still process July 8\'s partition.'},
 {t:'At-most / at-least / exactly once', d:'At-most-once may lose data; at-least-once may duplicate; exactly-once = at-least-once + dedup/transactions at the sink. Know the trio cold.'},
 {t:'Idempotency keys', d:'A unique event/run id stored with output lets consumers drop duplicates — the same trick payment APIs use.'},
 {t:'Backfill discipline', d:'Backfills replay N partitions of the same idempotent job — with rate limits so you don\'t flatten sources or blow the warehouse budget.'}
],
qa:[
 {q:'What is idempotency and why is it critical in pipelines?', a:'An idempotent operation produces the same end state whether executed once or many times. Pipelines run in unreliable environments — retries, replays, backfills, duplicate messages are normal — so a non-idempotent job (naive INSERT append) silently duplicates data on any hiccup. I design every job so a rerun for the same logical date overwrites or merges its slice, making retries and backfills boring instead of dangerous.', say:'"In distributed systems, everything runs twice eventually — design so that twice equals once."'},
 {q:'How do you make a daily load job idempotent, concretely?', a:'Parameterize it by logical date; have it own exactly one output partition (dt = logical date); write with INSERT OVERWRITE PARTITION or a MERGE keyed on business keys; keep transformations deterministic (no wall-clock dependence). Then any rerun replaces the same slice byte-for-byte.', say:'"One run owns one partition, and writing means replacing that partition."'},
 {q:'Explain exactly-once semantics in streaming honestly.', a:'True exactly-once delivery over a network is impossible; what systems achieve is exactly-once processing effects: the source is replayable (Kafka offsets), state is checkpointed atomically with progress, and the sink is transactional or idempotent so replayed events don\'t double-apply. Flink two-phase-commit sinks and Kafka transactions implement this — it\'s at-least-once delivery whose duplicates are neutralized at the write.', say:'"Exactly-once is at-least-once wearing an idempotent seatbelt."'},
 {q:'Business logic changed and three months of Gold data is wrong. Walk me through the backfill.', a:'Fix and deploy the transformation; verify Bronze still holds raw history for the window (medallion pays off here). Rerun the idempotent job per logical date across the range — orchestrators like Airflow/Composer have native backfill for exactly this — throttled to protect quotas. Validate a sample date against expectations, reconcile row counts and key metrics against the old output, then communicate the restated numbers to consumers.', say:'"A backfill is just yesterday\'s jobs run again — safe only because they were built idempotent and Bronze kept the raw truth."'}
],
oneLiner:'Retries aren\'t the exception, they\'re the weather. Idempotent jobs — one logical date, one owned partition, overwrite or merge — make reruns a shrug instead of an incident.',
pitfalls:['Claiming your system delivers "exactly-once" without mentioning idempotent/transactional sinks — instant credibility check.','Forgetting logical date parameterization — reruns that process "today" instead of the failed day corrupt data.']
},

/* ================= 11 Orchestration ================= */
{
id:'orchestration', num:'11', track:'t3',
title:'Orchestration & DAGs',
tagline:'A wedding planner\'s checklist: the caterer can\'t cook before the menu is chosen.',
analogy:{label:'Real-world analogy · The Wedding Planner',
text:'A wedding has hundreds of tasks with dependencies: book the venue <em>before</em> printing invitations; finalize the menu <em>before</em> the caterer shops; decoration and music can run <em>in parallel</em>. The <strong>planner</strong> doesn\'t cook or decorate — she sequences, triggers, chases delays, and re-plans when the florist cancels. That\'s an <strong>orchestrator</strong> (Airflow/Composer, Dagster, Prefect), and the dependency checklist — tasks and arrows, no circular waits — is a <strong>DAG</strong>.'},
stage:`<svg viewBox="0 0 800 300" role="img" aria-label="DAG with parallel branches and a failed task">

<text x="677" y="163" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono" fill="#8A7F6F" class="blink">waiting upstream…</text>
<text x="400" y="275" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#5C5347">parallel where possible · downstream blocked until dependencies succeed</text>
</svg>`,
body:`<p>A <strong>DAG</strong> (Directed Acyclic Graph) encodes tasks and their dependencies — directed arrows, no cycles, because a task can\'t wait on itself. The <strong>orchestrator</strong> schedules DAG runs, executes tasks in dependency order (parallelizing independent branches), retries failures with backoff, enforces SLAs and alerts, and provides backfill over historical logical dates.</p>
<p>Key vocabulary: <strong>Airflow/Cloud Composer</strong> (operators, sensors, XCom, task instances, logical date), <strong>Dagster</strong> (asset-oriented: declare the tables you want, not just tasks), <strong>Prefect</strong> (Pythonic flows). Orchestrators coordinate work; the heavy lifting runs on Spark/BigQuery/dbt — the planner doesn\'t cook.</p>`,
concepts:[
 {t:'Why acyclic', d:'A cycle means a task transitively depends on its own output — unschedulable. DAG structure is what lets the scheduler topologically sort work.'},
 {t:'Retries, SLAs, alerts', d:'Production value is in failure handling: exponential-backoff retries for transient errors, SLA misses paging owners, clear logs per task instance.'},
 {t:'Sensors & data-aware triggers', d:'Sensors wait for external readiness (file landed, partition exists). Modern pattern: trigger on data availability/assets, not just cron time.'},
 {t:'Tasks must be idempotent', d:'Orchestrators retry aggressively — module 10 is the price of admission. A non-idempotent task inside a retrying DAG is a data-corruption machine.'}
],
qa:[
 {q:'What is a DAG and why must it be acyclic?', a:'A directed acyclic graph models pipeline tasks as nodes and dependencies as directed edges. Acyclicity guarantees a valid execution order exists (topological sort): the scheduler can always find tasks whose dependencies are satisfied. A cycle would mean a task awaits a result that awaits itself — deadlock by design.', say:'"Arrows say \'after\', and nothing can come after itself — that\'s the whole rule."'},
 {q:'What does an orchestrator actually do? Isn\'t cron enough?', a:'Cron only answers "when." An orchestrator manages dependencies (run B only after A succeeds), parallelism, retries with backoff, backfills over logical dates, sensors for data readiness, SLA alerting, and per-task observability. With cron you end up hand-rolling all of that in scripts — the moment a pipeline has two dependent steps and a failure mode, cron is outgrown.', say:'"Cron is an alarm clock; an orchestrator is a wedding planner."'},
 {q:'Your 6 AM executive dashboard was empty today. How do you investigate?', a:'Check the orchestrator UI for the DAG run: which task failed or is it still running? Read that task\'s logs for root cause — commonly a late source file (sensor timeout), an upstream schema change, or quota errors. Assess blast radius via lineage, communicate ETA to stakeholders, fix or clear-and-rerun the failed task (safe because tasks are idempotent), and afterwards add a check or alert so this class of failure pages before executives notice.', say:'"Find the red task, read its logs, fix, rerun idempotently — then make sure the alert fires before the CEO does."'},
 {q:'Task-based vs asset-based orchestration?', a:'Airflow\'s classic model schedules tasks — imperative steps. Dagster (and dbt\'s DAG) center on assets — the tables/files that should exist — with tasks derived from asset dependencies. Asset thinking gives lineage, freshness tracking, and "rematerialize this table and its downstreams" for free, which maps better to how data teams actually reason.', say:'"Task-based asks \'did the job run?\'; asset-based asks \'is the table fresh?\' — the second is the question the business asks."'}
],
oneLiner:'Pipelines are weddings: many vendors, hard dependencies, guaranteed surprises. The orchestrator is the planner with the checklist, the phone, and the plan B.',
pitfalls:['Describing Airflow as "cron with UI" — dependency management and backfills are the actual point.','Forgetting that retries assume idempotent tasks — interviewers love linking this to module 10.']
},

/* ================= 12 Data Quality ================= */
{
id:'quality', num:'12', track:'t4',
title:'Data Quality & Observability',
tagline:'Airport security for data: every bag is screened before it boards.',
analogy:{label:'Real-world analogy · Airport Security',
text:'No airport lets bags board unchecked. Every bag passes <strong>screening layers</strong>: size and weight limits (schema checks), scanners for prohibited items (validation rules), matching bag to passenger (referential integrity). Suspicious bags go to a <strong>separate inspection room</strong> (quarantine) — they don\'t stop the whole airport, and they don\'t fly either. And the airport tracks metrics — how many bags flagged today vs normal? A sudden spike means something upstream changed. That monitoring is <strong>data observability</strong>.'},
stage:`<svg viewBox="0 0 800 300" role="img" aria-label="Data quality gates with quarantine lane">

<path d="M40 120 H160" stroke="#8A7F6F" stroke-width="3.5" stroke-dasharray="7 7" class="dotflow"/>

<text x="440" y="269" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono" fill="#A34E3F">alert if rate spikes</text>
<rect x="600" y="215" width="160" height="12" rx="6" fill="#E4DCCB"/>

<text x="680" y="250" text-anchor="middle" font-size="10" font-family="JetBrains Mono" fill="#5C5347">pass-rate metric → dashboard</text>
</svg>`,
body:`<p><strong>Data quality</strong> = checks that catch bad data before consumers do. The classic six dimensions: <strong>completeness</strong> (no missing values/rows), <strong>uniqueness</strong> (no duplicate keys), <strong>validity</strong> (values in legal ranges/formats), <strong>consistency</strong> (agrees across systems), <strong>accuracy</strong> (matches reality), <strong>timeliness</strong> (fresh enough). Tools: dbt tests, Great Expectations, Soda; pattern: gates between medallion layers, failures to quarantine with reasons.</p>
<p><strong>Data observability</strong> is the monitoring layer over pipelines and tables: freshness (did it update on time?), volume (row counts vs normal), schema changes, distribution drift, and <strong>lineage</strong> (what feeds what — the blast-radius map). Tools: Monte Carlo, Elementary, plus warehouse-native monitoring. Quality checks are the security scanners; observability is the control room watching all of them.</p>`,
concepts:[
 {t:'Test at the boundaries', d:'Cheapest place to catch bad data is on entry. Gate Bronze→Silver on schema/completeness, Silver→Gold on business rules.'},
 {t:'Quarantine, don\'t crash (usually)', d:'Route failing rows aside with failure reasons and alert on rates — one bad record shouldn\'t ground the whole flight schedule. Hard-fail only for critical financial tables.'},
 {t:'Freshness · volume · schema · distribution · lineage', d:'The five pillars of observability. Anomaly detection on volume and distribution catches "silent" failures no rule anticipated.'},
 {t:'Data contracts', d:'Agreements with producers: schema, semantics, SLAs — enforced in CI. Quality shifts left: the best bad record is one never produced.'}
],
qa:[
 {q:'How would you design data quality for a new pipeline?', a:'Layer it: schema validation and completeness checks at ingestion (Bronze→Silver gate), business rules — uniqueness of keys, referential integrity, value ranges — before Gold, with failing rows quarantined with reasons rather than silently dropped. Encode checks as code (dbt tests / Great Expectations) running inside the DAG so a critical failure blocks promotion. Then add observability on top: freshness, row-count anomaly detection, and alerts routed to the table\'s owner.', say:'"Every layer boundary is a security checkpoint, and quarantine keeps one bad bag from grounding the airport."'},
 {q:'What is the difference between data quality and data observability?', a:'Quality is assertion-based: rules you write in advance ("order_id is unique," "amount > 0") — they catch known failure modes. Observability is monitoring-based: tracking freshness, volume, schema, and distributions against learned baselines to catch unknown failure modes — like a source silently sending 40% fewer rows that individually pass every rule. Mature teams need both.', say:'"Quality catches the failures you predicted; observability catches the ones you didn\'t."'},
 {q:'A source added a column and your pipeline broke at 2 AM. How do you prevent this class of issue?', a:'Immediate fix aside, the systemic answers are: a data contract with the producer covering schema and change process, schema-evolution-tolerant ingestion (additive columns shouldn\'t break Bronze — Avro/Iceberg evolution rules), schema-change detection that alerts instead of crashes, and CI checks on the producer side so breaking changes fail their build, not my pipeline.', say:'"The best 2 AM page is the one converted into the producer\'s failing CI test at 2 PM."'},
 {q:'What is data lineage and when has it mattered?', a:'Lineage is the dependency map from sources through transformations to consumers, at table or column level. It matters in two directions: impact analysis downstream ("if I change this column, which dashboards break?") and root-cause analysis upstream ("this KPI looks wrong — which source fed it?"). Orchestrators, dbt, and catalogs like DataHub/Dataplex generate it automatically.', say:'"Lineage is the blast-radius map — without it every change is a guess and every incident is archaeology."'}
],
oneLiner:'Trust is the product. Screen every bag at the boundary, quarantine the suspicious ones, and keep a control room watching freshness and volume — because consumers finding bad data first is how data teams lose credibility.',
pitfalls:['Only listing rule-based tests — mention observability/anomaly detection for unknown-unknowns.','Saying "fail the pipeline on any bad row" — quarantine-and-alert is usually the mature answer, hard-fail is reserved for critical tables.']
}
);

{
id:'dim-modeling', num:'', track:'tmodel',
title:'Dimensional Modeling',
tagline:'A supermarket receipt: the line items are the facts, everything printed around them is context.',
analogy:{label:'Real-world analogy · The Supermarket Receipt',
text:'Every checkout prints a receipt. Each <em>line</em> — "2 × Milk @ ₹30 = ₹60" — is a <strong>fact</strong>: a measurable business event. But that line only means something because of the context printed around it: which <strong>store</strong>, which <strong>date</strong>, which <strong>product</strong>, which <strong>customer</strong> (loyalty card). Those are <strong>dimensions</strong>. The golden question is the <strong>grain</strong>: does one row mean one <em>receipt</em>, or one <em>line</em> on the receipt? Answer it wrong and every total is silently wrong. This receipt-and-context shape — measures in the middle, descriptive context radiating out — is a <strong>star schema</strong>.'},

body:`<p>Dimensional modeling — Ralph Kimball\'s method — shapes analytical data into two kinds of tables optimized for the questions analysts ask.</p>
<p><strong>Fact tables</strong> hold the measurable events of a business process: sales, clicks, shipments. Each row is one event at a defined grain, containing numeric <em>measures</em> (quantity, amount) and <em>foreign keys</em> to dimensions. <strong>Dimension tables</strong> hold the descriptive context — who, what, where, when: customer, product, store, date. A <strong>star schema</strong> connects one central fact to denormalized dimensions (all product attributes in one wide dim_product); a <strong>snowflake schema</strong> normalizes dimensions into sub-tables (product → category → department), saving storage at the cost of extra joins.</p>
<p><strong>Grain is the most important decision.</strong> "One row = one order line" versus "one row = one order" changes every measure and every possible duplicate. Declare it explicitly, first. On modern columnar warehouses the 2026 default is <strong>star</strong> — storage is cheap, joins are expensive, and small dimensions broadcast easily; reserve snowflake for genuine carve-outs.</p>`,
concepts:[
 {t:'Facts vs dimensions', d:'Facts are verbs (the measurable event, with numbers); dimensions are nouns (the context). Fact tables are long and thin; dimensions are short and wide.'},
 {t:'Grain, declared first', d:'What one fact row represents. Getting it wrong is the classic cause of 2×–4× duplicate rows and inflated totals. Kimball\'s step 2 of 4: declare the grain before touching columns.'},
 {t:'Star vs snowflake', d:'Star = denormalized dimensions, one join hop, fast and simple (the 2026 default). Snowflake = normalized sub-dimensions, less redundancy, more joins. Defaulting to snowflake reads as junior.'},
 {t:'Kimball vs Inmon', d:'Kimball (bottom-up): build dimensional marts directly, unify via conformed dimensions — fast, cloud-friendly, the common answer. Inmon (top-down): a normalized 3NF enterprise warehouse first, then marts — for tightly governed orgs.'}
],
qa:[
 {q:'What is dimensional modeling, and what are fact and dimension tables?', a:'Dimensional modeling structures analytical data into fact tables — the measurable events of a business process at a defined grain, holding numeric measures and foreign keys — and dimension tables, which hold the descriptive context (customer, product, date, store). Arranged as a star schema, it matches how analysts ask questions: one join from the fact to any dimension answers "revenue by category last quarter" without a seven-table join.', say:'"Facts are the verbs — the measurable events; dimensions are the nouns — the who, what, where, when."'},
 {q:'What is grain, and why is it the most important modeling decision?', a:'Grain is what a single fact row represents — one order, one order line, one daily snapshot. It must be declared explicitly and early because it determines every measure\'s meaning and every duplication risk. A grain that\'s finer or coarser than you assumed produces double-counted revenue or lost detail. Kimball\'s four steps put it second — pick the business process, declare the grain, choose dimensions, choose facts — precisely because everything downstream depends on it.', say:'"Declare the grain first — get it wrong and every total is wrong in a way that\'s invisible until an executive notices."'},
 {q:'Star vs snowflake schema — which do you default to and why?', a:'Star, on modern columnar warehouses. Its dimensions are denormalized, so any context is one join hop away — simpler queries, and small dimensions broadcast into joins cheaply. Snowflake normalizes dimensions into sub-tables to cut redundancy, which mattered when storage was expensive but rarely justifies the extra joins today. I reserve snowflake for a genuine carve-out — a large hierarchy whose levels version at different cadences. Reaching for snowflake by default signals inexperience.', say:'"Storage is cheap, joins are expensive — default to star, snowflake only for a real reason."'},
 {q:'Explain Kimball vs Inmon.', a:'Two warehouse philosophies. Inmon is top-down: build a normalized 3NF enterprise data warehouse as the single source of truth first, then derive dimensional marts — better for tightly governed, integration-heavy organizations. Kimball is bottom-up: build dimensional marts directly around business processes and unify them through conformed dimensions (shared, consistent dimensions like a single dim_date used everywhere) — faster time-to-value and the common default in cloud setups, even ones branded as lakehouses.', say:'"Inmon builds the whole warehouse then cuts marts; Kimball builds marts and stitches them with conformed dimensions."'}
],
oneLiner:'A fact table is a stack of receipts; dimensions are the context printed around every line. Nail the grain, default to a star, and analysts can answer anything in one join.',
pitfalls:['Reaching for a snowflake schema first — on cloud warehouses this reads as junior; default to star and justify any snowflake carve-out.','Not declaring the grain, or getting it wrong — the number-one cause of duplicated fact rows and inflated metrics.']
},

{
id:'nosql-cap', num:'', track:'t1',
title:'NoSQL & the CAP Theorem',
tagline:'Two bank branches lose contact — do you keep serving, or keep the numbers correct? You cannot do both.',
analogy:{label:'Real-world analogy · The Two Disconnected Branches',
text:'A bank has two branches that suddenly can\'t talk to each other — the network between them is down (a <strong>Partition</strong>). A customer walks into Branch A wanting to withdraw. You face an unavoidable choice. Let the withdrawal proceed from Branch A\'s local copy — you stay <strong>Available</strong>, but now the two branches may <em>disagree</em> about the balance (you sacrificed <strong>Consistency</strong>). Or refuse until the branches reconnect — you stay <strong>Consistent</strong>, but the customer is turned away (you sacrificed <strong>Availability</strong>). During a partition you <em>cannot</em> have both. That is the <strong>CAP theorem</strong>, and it is why "which database?" is really "which tradeoff?"'},
stage:`<svg viewBox="0 0 800 300" role="img" aria-label="CAP theorem: consistency versus availability during a partition">
<rect width="800" height="300" fill="#FFFDF8"/>
<rect x="70" y="110" width="150" height="80" rx="12" fill="#E3EFEB" stroke="#0F6B5C" stroke-width="2"/><text x="145" y="140" text-anchor="middle" font-size="12" font-family="JetBrains Mono" fill="#0F6B5C" font-weight="700">Branch A</text><text x="145" y="162" text-anchor="middle" font-size="10" font-family="JetBrains Mono" fill="#0F6B5C">balance ₹500</text>
<rect x="580" y="110" width="150" height="80" rx="12" fill="#E3EFEB" stroke="#0F6B5C" stroke-width="2"/><text x="655" y="140" text-anchor="middle" font-size="12" font-family="JetBrains Mono" fill="#0F6B5C" font-weight="700">Branch B</text><text x="655" y="162" text-anchor="middle" font-size="10" font-family="JetBrains Mono" fill="#0F6B5C">balance ₹500</text>
<line x1="225" y1="150" x2="360" y2="150" stroke="#A34E3F" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="440" y1="150" x2="575" y2="150" stroke="#A34E3F" stroke-width="3" stroke-dasharray="8 6"/>
<text x="400" y="128" text-anchor="middle" font-size="26" fill="#A34E3F" class="blink">✂</text>
<text x="400" y="165" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#A34E3F" font-weight="700">PARTITION</text>
<rect x="240" y="215" width="150" height="60" rx="10" fill="#EAF3EC" stroke="#3E7C4F" stroke-width="1.8"/><text x="315" y="238" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#2E5E3C" font-weight="700">choose AVAILABLE</text><text x="315" y="256" text-anchor="middle" font-size="9" font-family="JetBrains Mono" fill="#2E5E3C">serve now, may disagree</text>
<rect x="410" y="215" width="150" height="60" rx="10" fill="#FBF3DC" stroke="#C9A227" stroke-width="1.8"/><text x="485" y="238" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#A2831F" font-weight="700">choose CONSISTENT</text><text x="485" y="256" text-anchor="middle" font-size="9" font-family="JetBrains Mono" fill="#A2831F">refuse until reconnected</text>
<text x="400" y="55" text-anchor="middle" font-size="12.5" font-family="JetBrains Mono" fill="#5C5347" font-weight="700">during a partition, pick one ↓</text>
</svg>`,
body:`<p><strong>NoSQL</strong> ("not only SQL") databases dropped the rigid relational model to scale out and handle variety. Four families, each a different container: <strong>key-value</strong> (Redis, DynamoDB) — a giant dictionary, blazing fast lookups by key; <strong>document</strong> (MongoDB) — self-contained JSON documents, flexible schema; <strong>wide-column</strong> (Cassandra, HBase) — rows with huge, sparse column sets, built for write-heavy scale; <strong>graph</strong> (Neo4j) — nodes and relationships, for connection-heavy queries (fraud rings, social networks).</p>
<p>The <strong>CAP theorem</strong> says a distributed store can guarantee at most two of Consistency, Availability, and Partition tolerance. Since network partitions <em>will</em> happen, P is not optional — so the real choice is <strong>CP</strong> (stay consistent, refuse during a partition — banking, inventory) or <strong>AP</strong> (stay available, reconcile later via eventual consistency — shopping carts, social feeds). This pairs with <strong>ACID vs BASE</strong>: relational systems favor ACID (strong guarantees); many NoSQL systems favor BASE (Basically Available, Soft state, Eventual consistency).</p>`,
concepts:[
 {t:'The four NoSQL families', d:'Key-value (dictionary), document (JSON blobs), wide-column (sparse rows at write-scale), graph (relationships). Pick by access pattern, not popularity.'},
 {t:'CAP: P is not optional', d:'In any distributed system partitions happen, so you don\'t "pick 2 of 3" freely — you choose C or A for the moments a partition occurs. CP refuses to serve stale; AP serves and reconciles.'},
 {t:'ACID vs BASE', d:'ACID = strong, immediate consistency (relational, financial). BASE = Basically Available, Soft state, Eventually consistent (many NoSQL) — trades immediacy for availability and scale.'},
 {t:'When NoSQL is the wrong tool', d:'Complex multi-entity joins, ad-hoc analytics, and strong multi-row transactions still favor relational/SQL. NoSQL shines for known access patterns at scale, not for "we might query it any way later."'}
],
qa:[
 {q:'When would you choose NoSQL over a relational database?', a:'When the access pattern is known and simple but the scale or flexibility exceeds what a single relational instance handles well: massive key-based lookups (key-value), flexible evolving documents (document), write-heavy time-series or event data at scale (wide-column), or relationship-traversal queries (graph). I stay relational when I need rich ad-hoc joins, strong multi-row ACID transactions, or analytics where query shapes aren\'t known in advance. The decision is access pattern and consistency needs, not hype.', say:'"NoSQL rewards a known access pattern at scale; SQL rewards flexible questions and strong transactions."'},
 {q:'Explain the CAP theorem.', a:'A distributed data store can guarantee at most two of Consistency (every read sees the latest write), Availability (every request gets a non-error response), and Partition tolerance (the system keeps working despite dropped network messages). Because partitions are a fact of distributed life, P isn\'t truly optional — so the real tradeoff surfaces only during a partition: do you stay consistent by refusing requests (CP), or stay available by serving possibly-stale data and reconciling later (AP)?', say:'"You don\'t pick two of three at leisure — when the network splits, you pick consistency or availability."'},
 {q:'Give real examples of CP vs AP systems.', a:'CP (consistency over availability during a partition): a banking ledger or inventory system — better to reject a transaction than to double-spend or oversell; systems like HBase and traditional RDBMS clusters lean CP. AP (availability over consistency): a shopping cart, social feed, or DNS — better to always respond and reconcile later; Cassandra and DynamoDB are tunable but classically lean AP with eventual consistency. Many modern stores let you tune consistency per operation.', say:'"Bank balance → CP; shopping cart and likes → AP."'},
 {q:'What is eventual consistency, and when is it acceptable?', a:'Eventual consistency means replicas may temporarily disagree after a write but will converge to the same value once messages propagate. It\'s acceptable when brief staleness causes no harm — a like count, a product view counter, a cart that reconciles at checkout — and unacceptable where a stale read causes a wrong decision, like account balances or seat inventory. The BASE model builds on this: prioritize availability, accept soft state, converge eventually.', say:'"Eventual consistency is fine for a like count and dangerous for a bank balance."'}
],
oneLiner:'Every distributed database is a bet on the moment the network splits — stay correct or stay available. NoSQL just gives you more containers and more ways to place that bet.',
pitfalls:['Saying "NoSQL means no schema and it\'s always faster" — it means a different data model with different tradeoffs, and it\'s slower for the queries it wasn\'t designed for.','Misstating CAP as "always pick any 2 of 3" — partition tolerance is mandatory in distributed systems; the choice is C vs A during a partition.']
}
);

{
id:'spark', num:'', track:'tproc',
title:'Distributed Processing (Spark)',
tagline:'Counting every word in a million books: one librarian is hopeless, a hundred assistants is the answer.',
analogy:{label:'Real-world analogy · The Library Census',
text:'To count every word across a million books, one librarian would die of old age. Instead, a <strong>manager</strong> splits the books into a hundred piles and hands one to each <strong>assistant</strong>. Each assistant counts their own pile locally, fast, in parallel — a <strong>narrow</strong> step, no one needs anyone else. But to get "total words per author," assistants must <em>regroup</em> their slips by author and pass them around the whole room — a <strong>shuffle</strong>: slow, everyone moving at once, the expensive part. The manager (the <strong>driver</strong>) never counts; she plans the job, hands out work, collects results, and re-does a pile if an assistant faints. And she doesn\'t lift a finger until you actually ask for the final tally — she plans everything first. That is Apache Spark.'},

<text x="400" y="192" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#A34E3F" font-weight="700">— SHUFFLE (regroup by author, all-to-all) —</text>
<path d="M120 200 C 250 235, 550 235, 680 200" stroke="#A34E3F" stroke-width="2" fill="none" stroke-dasharray="6 6" class="dotflow"/>

</svg>`,
body:`<p><strong>Spark</strong> is a distributed, in-memory processing engine. A job runs across a <strong>driver</strong> (coordinates, builds the plan) and many <strong>executors</strong> (do the work on partitions of the data), with a <strong>cluster manager</strong> (YARN/Kubernetes) allocating resources.</p>
<p><strong>Transformations are lazy.</strong> map/filter/join just build a plan — a <strong>DAG</strong> of steps. Nothing runs until an <strong>action</strong> (count, collect, write) fires; then Spark optimizes the DAG (via the <strong>Catalyst optimizer</strong>) and executes it as <strong>stages → tasks</strong> (one task per partition). Lazy planning lets Spark fuse steps and skip unused work, and lineage lets it recompute a lost partition instead of restarting.</p>
<p><strong>Narrow vs wide is the performance story.</strong> A <em>narrow</em> transformation (map, filter) needs only one input partition — pipelined, fast. A <em>wide</em> transformation (groupBy, join, distinct) needs data from many partitions — a <strong>shuffle</strong>: disk I/O, network I/O, and serialization, the three slowest things a computer does, and each shuffle marks a stage boundary. Minimize shuffles. A <strong>broadcast join</strong> avoids one entirely by shipping a small table to every executor. And <strong>data skew</strong> — one giant partition — makes the whole job wait on one task; the fix is salting keys or Adaptive Query Execution.</p>`,
concepts:[
 {t:'Lazy evaluation & the DAG', d:'Transformations build a plan; actions trigger it. Spark optimizes the whole DAG before running, fuses narrow steps, and skips work no action needs.'},
 {t:'Driver / executor / stages / tasks', d:'Driver plans and schedules; executors process partitions. A job splits into stages at shuffle boundaries; each stage runs as parallel tasks — one per partition.'},
 {t:'Shuffle is the dominant cost', d:'Wide transformations move data across the network (disk + network + serialization). Every shuffle is a stage boundary. "Minimize shuffles" is the core tuning mantra.'},
 {t:'Broadcast joins & skew', d:'Broadcast a small table to every executor to turn a wide join into a narrow one. Skew (one hot partition) makes the job wait on one task — fix with salting or AQE.'}
],
qa:[
 {q:'Explain the Spark architecture and execution model.', a:'A Spark application has a driver that builds the logical plan and schedules work, and executors that process partitions of the data in parallel, with a cluster manager (YARN or Kubernetes) allocating resources. Transformations are lazy — they build a DAG — and execution starts only when an action fires. Spark then optimizes the DAG via Catalyst and breaks it into stages at shuffle boundaries, each stage running as tasks, one per partition. If a partition is lost, lineage lets Spark recompute just that partition.', say:'"A job is divided into stages by shuffle boundaries, and each stage runs as parallel tasks — one per partition."'},
 {q:'What is the difference between transformations and actions, and what is lazy evaluation?', a:'Transformations (map, filter, join, groupBy) define new datasets but don\'t execute — they build a plan. Actions (count, collect, write) trigger execution. Lazy evaluation means Spark waits until an action to run anything, which lets it optimize the entire pipeline at once — fusing narrow operations, pushing filters down, and skipping any transformation whose result no action actually needs.', say:'"Transformations write the recipe; the action turns on the oven."'},
 {q:'What is a shuffle, and why is it expensive?', a:'A shuffle is the redistribution of data across executors that a wide transformation (join, groupBy, distinct, repartition) requires so that all records with the same key land together. It\'s expensive because it involves disk I/O (spilling shuffle files), network I/O (every reduce task pulls from every map task), and serialization — the three slowest operations. Each shuffle is also a stage boundary. Because a stage with no shuffle runs at memory speed, the primary Spark tuning goal is minimizing and shrinking shuffles.', say:'"A shuffle makes the whole room pass slips to each other — disk, network, and serialization all at once."'},
 {q:'A Spark job is slow — how do you diagnose and fix it?', a:'Open the Spark UI and inspect the physical plan and stage metrics. I look for heavy shuffle read/write (data movement), a large gap between max and median task time (skew), spill to disk (insufficient executor memory), and high GC. Common fixes, smallest first: broadcast a small side of a join to remove a shuffle, repartition or salt to fix skew, right-size shuffle partitions (the default 200 is often wrong), replace groupByKey with reduceByKey, cache only genuinely reused data, and enable AQE to coalesce and de-skew at runtime. Then I validate the change against the metrics.', say:'"Read the plan, find the shuffle or the skew in the Spark UI, apply the smallest effective lever, and confirm it in the metrics."'}
],
oneLiner:'Spark is a manager with a hundred assistants: count in place wherever you can (narrow), and dread the moment everyone has to pass slips across the room (the shuffle). Tuning Spark is minimizing that moment.',
pitfalls:['Treating Spark as a black box — not explaining DAG/stages/tasks or what causes a shuffle instantly loses credibility.','Saying "just cache it" as a reflex, or confusing repartition (full shuffle) with coalesce (merge without full shuffle).']
},

tagline:'GROUP BY collects one card per class; a window function ranks each student without sending anyone home.',
analogy:{label:'Real-world analogy · The Class Ranking',
text:'Say you have every student\'s marks. <strong>GROUP BY</strong> is like collecting <em>one summary card per class</em> — the class average — but the individual students vanish into that single card. A <strong>window function</strong> is like standing every student in a line and writing their <em>rank next to them</em>: every student keeps their own row, but each now knows their position within their class. That difference — collapse-to-a-summary versus annotate-each-row-while-looking-at-its-neighbors — is the concept interviewers probe most, because most people only know GROUP BY. Add <strong>JOIN</strong> (matching two lists by a shared ID) and <strong>CTEs</strong> (naming each prep step), and you can answer almost any data question cleanly.'},

body:`<p>SQL is the non-negotiable core skill — it appears in nearly every DE interview round, and interviewers separate people who think in <em>execution plans</em> from people who only know syntax.</p>
<p><strong>JOINs</strong> match rows across tables by a shared key: INNER (only matches), LEFT (all left rows + matches), FULL OUTER (everything, NULLs where no match). <strong>Window functions</strong> — <span class="mono">ROW_NUMBER, RANK, LAG/LEAD, SUM() OVER(...)</span> — compute across a set of rows <em>related to the current row</em> without collapsing them, using <span class="mono">PARTITION BY</span> (the group) and <span class="mono">ORDER BY</span> (the sequence). This is how you rank within groups, compute running totals, and compare a row to the previous one. <strong>CTEs</strong> (<span class="mono">WITH … AS</span>) name intermediate steps so a complex query reads like a labeled recipe and can be chained.</p>
<p>A daily task is <strong>deduplication</strong>: <span class="mono">ROW_NUMBER() OVER (PARTITION BY key ORDER BY updated_at DESC)</span> then keep row 1 — the canonical "latest record per key" pattern. And on columnar warehouses, <strong>query optimization</strong> means reading the plan and fixing scans, skew, and joins — not "add an index" (indexes rarely apply to warehouses).</p>`,
concepts:[
 {t:'Window vs aggregate', d:'GROUP BY collapses rows into one per group; a window function keeps every row and adds a computed column over its partition. The most-tested and most-misunderstood distinction.'},
 {t:'JOIN types', d:'INNER (matches only), LEFT (all left + matches), FULL OUTER (all rows, NULLs on gaps). Choosing wrong silently drops or duplicates rows — always know which side you need.'},
 {t:'CTEs for readability', d:'WITH … AS names each step, turning a nested seven-join monster into a linear, testable sequence. Preferred in pipelines for maintainability; can be chained.'},
 {t:'Dedup & optimization', d:'ROW_NUMBER() PARTITION BY key ORDER BY updated_at → keep row 1 = latest-per-key. On warehouses, optimize via the query plan (pruning, join strategy, pre-aggregation), not indexes.'}
],
qa:[
 {q:'What is the difference between a window function and GROUP BY?', a:'GROUP BY collapses rows into one summary row per group, so individual rows are lost. A window function computes an aggregate or ranking over a set of rows related to the current row — defined by PARTITION BY and ORDER BY — while keeping every original row and adding the result as a new column. So to get "each employee\'s salary and their rank within their department," you use a window function; GROUP BY could only give you the department averages.', say:'"GROUP BY collects one card per class; a window function ranks each student and keeps them all."'},
 {q:'How do you find and remove duplicate rows in SQL?', a:'The canonical pattern uses a window function: ROW_NUMBER() OVER (PARTITION BY the columns that define a duplicate, ORDER BY a tiebreaker like updated_at DESC), then keep only the rows where that number equals 1. This deterministically keeps the latest (or preferred) record per key. It\'s more controllable than DISTINCT or GROUP BY because you choose exactly which duplicate survives — essential for CDC merges and data cleaning.', say:'"Number the duplicates by key, order by recency, keep number one."'},
 {q:'Explain INNER, LEFT, and FULL OUTER JOIN.', a:'INNER JOIN returns only rows with a match in both tables. LEFT JOIN returns all rows from the left table plus matches from the right, with NULLs where there\'s no match — used to keep all records and enrich them. FULL OUTER JOIN returns all rows from both sides, NULLs filling non-matches — used for reconciliation, like finding records present in one system but missing in another. Picking the wrong join is a common source of silently dropped or duplicated rows.', say:'"INNER keeps only matches, LEFT keeps everyone on the left, FULL keeps everyone on both sides."'},
 {q:'A warehouse query is slow and expensive — how do you optimize it?', a:'I start with the query plan — the profile view in Snowflake or the execution graph in BigQuery — looking for full table scans, huge intermediate results, and skewed joins. Common wins: ensure filters hit partition and cluster keys directly (no functions wrapping them), rewrite correlated subqueries as window functions, pre-aggregate large facts into incremental models or materialized views since dashboards re-run the same shape, and reorder or broadcast small-side joins. Indexes rarely apply to columnar warehouses — reaching for one is itself a signal. Sometimes the query is fine and the compute is just undersized.', say:'"Read the plan first — prune, pre-aggregate, fix the join; on a warehouse, indexes are usually the wrong answer."'}
],
oneLiner:'SQL is the language the whole data stack speaks, and window functions are its most misunderstood word: they annotate every row instead of collapsing them. Master that, joins, and CTEs, and no query round can surprise you.',
pitfalls:['Reaching for an index to speed up a columnar warehouse query — partitioning, clustering, and the query plan are the real levers; indexes rarely apply.','Treating SQL as a junior topic or only knowing GROUP BY — window functions, CTEs, and reading execution plans are exactly what separates candidates.']
}
);

analogy:{label:'Real-world analogy · The Newspaper & Its Subscribers',
text:'A newspaper (a <strong>topic</strong>) prints continuously. To print faster it runs several presses in parallel (<strong>partitions</strong>) — so order is guaranteed <em>within one press\'s stack</em>, but not across presses. Every subscriber (a <strong>consumer</strong>) keeps a bookmark of the last edition they read (an <strong>offset</strong>) and reads at their own pace; the paper keeps back-issues (<strong>retention</strong>) so a brand-new subscriber can start from issue #1 or from today. A household sharing one subscription (a <strong>consumer group</strong>) divides the presses among its members, so each edition is read exactly once by the household. That is Apache Kafka — a durable, replayable log that decouples who writes from who reads.'},

body:`<p><strong>Kafka</strong> is a distributed, append-only commit log that buffers data between producers and consumers, giving high throughput and fault tolerance. It\'s the backbone of streaming and CDC pipelines because it <em>decouples</em> producers from consumers and <em>retains</em> data for replay.</p>
<p>Core vocabulary: a <strong>topic</strong> is a named stream; it\'s split into <strong>partitions</strong> for parallelism, and ordering is guaranteed only <em>within</em> a partition. Each message has an <strong>offset</strong> (its position); consumers track their own offset, so they read independently and can rewind. A <strong>consumer group</strong> shares a topic\'s partitions among its members so each message is processed once per group — that\'s how you scale consumers. <strong>Brokers</strong> store partitions and replicate them for durability.</p>
<p>Production concerns interviewers love: <strong>exactly-once</strong> (offsets committed transactionally with idempotent writes), a <strong>dead-letter queue</strong> for messages that fail processing (bad schema, corrupt payload) so one poison message doesn\'t halt the stream, <strong>backpressure</strong> when producers outrun consumers (scale consumers, batch, rate-limit), and <strong>log compaction</strong> to retain only the latest value per key (for rebuilding state).</p>`,
concepts:[
 {t:'Topic · partition · offset', d:'Topic = named stream; partitions = parallel lanes (order only within a lane); offset = each message\'s position, tracked per consumer so reads are independent and replayable.'},
 {t:'Consumer groups scale reads', d:'A group divides partitions among members — each partition to exactly one member — so messages are processed once per group. More partitions = more parallelism ceiling.'},
 {t:'Retention & replay', d:'Kafka keeps messages for a retention window (or compacts to latest-per-key), so new or recovering consumers can replay history — the foundation of Kappa-style reprocessing.'},
 {t:'DLQ & backpressure', d:'Route un-processable messages to a dead-letter queue instead of blocking the pipeline. Handle backpressure (producers outrunning consumers) by scaling consumers, batching, or rate-limiting.'}
],
qa:[
 {q:'What is Kafka, and explain topics, partitions, and offsets.', a:'Kafka is a distributed, append-only log used to build high-throughput, fault-tolerant streaming pipelines that buffer data between producers and consumers. A topic is a named category of messages; it\'s divided into partitions for parallel processing, with ordering guaranteed only within a partition, not across them. Each message in a partition has an offset — a unique, increasing ID — and each consumer tracks its own offset, so consumers read at their own pace and can rewind or replay.', say:'"One newspaper, many presses for speed, and each subscriber keeps their own bookmark."'},
 {q:'How do consumer groups enable parallelism, and what happens on rebalance?', a:'A consumer group is a set of consumers cooperating to read a topic; Kafka assigns each partition to exactly one member of the group, so the group processes every message once and adding consumers (up to the partition count) increases throughput. If a consumer joins or dies, Kafka rebalances — reassigning partitions across the surviving members — which briefly pauses consumption and is why you keep processing idempotent and commit offsets carefully to avoid reprocessing or gaps.', say:'"The household splits the presses so each edition is read once — and re-splits when someone joins or leaves."'},
 {q:'How does Kafka support exactly-once, and how do you handle bad messages?', a:'Exactly-once is achieved by committing consumer offsets transactionally together with the output write, plus idempotent producers, so a replay after failure doesn\'t double-apply. For messages that can\'t be processed — invalid schema, corrupt payload, missing fields — you route them to a dead-letter queue with the failure reason rather than stopping the stream, then review or reprocess them separately. This keeps the main pipeline flowing while nothing is silently dropped.', say:'"Commit the offset with the write for exactly-once; send poison messages to a dead-letter queue so one bad record can\'t halt everything."'},
 {q:'How do you guarantee message ordering, and what is backpressure?', a:'Ordering in Kafka holds only within a partition, so to keep related events ordered you send them to the same partition using a partition key (e.g., customer_id) — then that customer\'s events are strictly ordered even though the topic overall is parallel. Backpressure is when producers send faster than consumers can process, risking lag, memory pressure, or failure; you handle it by scaling out consumers, batching, rate-limiting the producer, and buffering with checkpointing so the system degrades gracefully instead of collapsing.', say:'"Key by the entity to keep its events in order; absorb backpressure by scaling consumers and rate-limiting, not by praying."'}
],
oneLiner:'Kafka is a durable newspaper printed on parallel presses and read by subscribers with their own bookmarks — it decouples writers from readers and keeps back-issues, which is why every streaming and CDC pipeline runs through it.',
pitfalls:['Assuming Kafka guarantees global ordering across a topic — it only orders within a partition; key by the entity to preserve per-entity order.','Ignoring consumer-group rebalancing and offset-commit semantics — the usual source of duplicate or skipped processing in real systems.']
},

body:`<p><strong>Data governance</strong> is the set of practices that make a data estate trustworthy, discoverable, and compliant. As companies hit petabyte scale across multiple clouds, it shifted from niche to core — "metadata engineering" is now a named competency.</p>
<p><strong>Metadata &amp; catalogs</strong> (DataHub, Collibra, Dataplex, Unity Catalog) record what data exists, who owns it, what each field means, and its quality — so people find and trust data without reading it all. <strong>Lineage</strong> maps the path from source through every transformation to each consumer, powering impact analysis ("if I change this column, what breaks?") and root-cause analysis ("this KPI is wrong — where did it come from?"). <strong>Security</strong> covers access control (role/row/column-level), PII handling (masking, tokenization, encryption), and the principle of least privilege. <strong>Data contracts</strong> are enforced agreements between producers and consumers on schema, semantics, and SLAs — shifting quality left. And <strong>compliance</strong> (GDPR, HIPAA) adds legal obligations like the right to be forgotten, retention limits, and audit trails.</p>`,
concepts:[
 {t:'Catalog & metadata', d:'A searchable inventory of data assets with owners, definitions, and quality signals. Without it, a large data estate is unusable and untrusted — you can\'t govern what you can\'t find.'},
 {t:'Lineage = the blast-radius map', d:'Source-to-consumer dependency graph. Powers impact analysis before a change and root-cause analysis during an incident. Without it, every change is a guess.'},
 {t:'Security & PII', d:'Least-privilege access (role/row/column-level), plus masking, tokenization, and encryption for sensitive fields. "Load raw first" never means "store unprotected."'},
 {t:'Contracts & compliance', d:'Data contracts enforce producer/consumer schema and SLA agreements in CI (shift quality left). Compliance (GDPR/HIPAA) mandates right-to-be-forgotten, retention, and audit trails.'}
],
qa:[
 {q:'What is data governance and why has it become a core skill?', a:'Data governance is the discipline of making data discoverable, trustworthy, secure, and compliant — spanning cataloging/metadata, lineage, access control, quality, and regulatory obligations. It became core because at petabyte, multi-cloud scale you can no longer keep the data landscape in people\'s heads: teams can\'t find data, can\'t trust it, and can\'t prove compliance without formal catalogs, lineage, and controls. Interviewers now treat "how do you know what data you have and who can use it?" as a real competency, not paperwork.', say:'"Governance is the catalog, the locked room, and the checkout log that make a huge data estate usable and safe."'},
 {q:'What is data lineage and how have you used it?', a:'Lineage is the dependency map from sources through transformations to consumers, at table or column level. I use it in two directions: downstream impact analysis before a change — "if I alter this column, which dashboards and models break?" — and upstream root-cause analysis during an incident — "this metric looks wrong, which source and job produced it?" Orchestrators, dbt, and catalogs like DataHub or Dataplex generate it automatically, turning what would be archaeology into a query.', say:'"Lineage is the blast-radius map — without it every change is a gamble and every incident is a dig."'},
 {q:'How do you handle PII and sensitive data in a pipeline?', a:'Least privilege plus defense in depth: restrict access with role-, row-, and column-level controls; mask or tokenize sensitive fields so most users see R*** K**** rather than the real value; encrypt in transit and at rest; and isolate raw sensitive data in a tightly-governed zone. For data that must be de-identified before it ever lands, a thin in-flight masking step runs first. Everything sensitive is tagged (policy tags/classification) so controls apply consistently, and access is logged for audit.', say:'"Mask, tokenize, encrypt, least-privilege — raw never means unprotected."'},
 {q:'What is a data contract, and how does it relate to compliance?', a:'A data contract is an enforced agreement between a data producer and its consumers covering schema, semantics, and SLAs — validated in the producer\'s CI so a breaking change fails their build rather than my 2 AM pipeline. It shifts quality and stability left. Compliance obligations like GDPR or HIPAA add legal requirements on top — the right to be forgotten (deleting an individual\'s data on request, which is why table-format row-level deletes matter), retention limits, and audit trails — all of which governance tooling helps enforce and prove.', say:'"A contract stops breaking changes at the producer\'s CI; compliance adds the legal must-dos like right-to-be-forgotten and audit."'}
],
oneLiner:'A data estate without governance is a national archive with no catalog and no locked room — either no one can find anything, or anyone can walk out with the secrets. Governance makes it findable, traceable, protected, and accountable.',
pitfalls:['Framing governance as bureaucracy that slows teams down — done well it\'s an enabler (people find and trust data faster); interviewers want that framing.','Having no concrete PII/access strategy — "we restrict access" is thin; name masking, tokenization, column-level security, and least privilege.']
},

text:'A great architect never sketches on the first day. They ask: how many people live here? which rooms matter? what\'s the budget? will you add a floor later? what happens in an earthquake? Only then do they choose materials — not the trendiest, the <em>fittest</em>. A weak architect shows up with a blueprint for a house you never described. <strong>Pipeline design interviews are identical.</strong> The first ten minutes should be <em>questions, not architecture</em>: data volume, latency needs, who consumes it, the SLA, the budget, and what happens when a component fails. Candidates who jump straight to naming tools lose instantly.'},
