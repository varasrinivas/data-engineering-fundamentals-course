<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Engineering Core — The Interview-Ready Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6EF; --paper-2:#F2ECDF; --card:#FFFDF8;
  --ink:#2B2620; --ink-soft:#5C5347; --ink-faint:#8A7F6F;
  --teal:#0F6B5C; --teal-soft:#E3EFEB;
  --bronze:#B08D57; --silver:#9BA3AD; --gold:#C9A227;
  --line:#E4DCCB; --danger:#A34E3F; --ok:#3E7C4F;
  --mono:'JetBrains Mono',monospace; --disp:'Fraunces',serif;
  --r:14px; --shadow:0 2px 10px rgba(43,38,32,.07);
}
/* ---------- dark theme (overrides the tokens above) ---------- */
:root[data-theme="dark"]{
  --paper:#17140F; --paper-2:#1E1A14; --card:#241F18;
  --ink:#ECE5D6; --ink-soft:#B7AD9B; --ink-faint:#8B806E;
  --teal:#3DA491; --teal-soft:#12332C;
  --bronze:#C6A06A; --silver:#9BA3AD; --gold:#D4B23C;
  --line:#39332A; --danger:#C77161; --ok:#5FA277;
  --shadow:0 2px 12px rgba(0,0,0,.45);
}
/* diagrams keep their own light canvas — treat them as embedded figures */
:root[data-theme="dark"] .stage{background:#FFFDF8;border-color:#2A2820}
:root[data-theme="dark"] .stage-cap{color:#8A7F6F;border-top-color:#E4DCCB}
/* hardcoded-light chrome the CSS variables don't reach */
:root[data-theme="dark"] .navitem.mock-nav{background:#2E2712;color:#E4C878;border-color:#4A3E1C}
:root[data-theme="dark"] .navitem.mock-nav:hover{background:#3A3016}
:root[data-theme="dark"] .navitem.mock-nav.active{background:#463A1A;color:#F0D488}
:root[data-theme="dark"] .qa-q .qm{background:#3A3016;color:#E4C878}
:root[data-theme="dark"] .pit{background:#2E1B16;border-color:#4A2B22;color:#E0A99B}
:root[data-theme="dark"] .pit .pi{color:#E08A76}
:root[data-theme="dark"] .rate-btn.n{background:#16301E;color:#7FC294}
:root[data-theme="dark"] .rate-btn.p{background:#302912;color:#E4C878}
:root[data-theme="dark"] .rate-btn.m{background:#2E1B16;color:#E0A99B}
:root[data-theme="dark"] .wchip{background:#2E1B16;border-color:#4A2B22;color:#E0A99B}
:root[data-theme="dark"] .wchip:hover{border-color:#C77161}
/* theme toggle button */
.theme-toggle{width:100%;margin:2px 0 16px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;transition:border-color .15s,color .15s}
.theme-toggle:hover{border-color:var(--teal);color:var(--teal)}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--disp);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
.mono{font-family:var(--mono)}
button{font-family:var(--mono);cursor:pointer}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{background:var(--paper-2);border-right:1px solid var(--line);padding:26px 20px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:0;min-width:0}
.wrap{max-width:860px;margin:0 auto;padding:34px 30px 90px}

/* ---------- sidebar ---------- */
.brand{font-weight:900;font-size:21px;line-height:1.2;letter-spacing:-.01em}
.brand .tealtx{color:var(--teal)}
.brand-sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.14em;margin:8px 0 18px}
.progress-shell{background:var(--line);height:6px;border-radius:99px;overflow:hidden;margin:0 0 6px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--bronze),var(--silver),var(--gold));border-radius:99px;transition:width .5s ease}
.progress-label{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-bottom:20px}
.tracklbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-faint);margin:18px 0 6px}
.navitem{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:8px 10px;font-family:var(--disp);font-size:14.5px;color:var(--ink-soft);line-height:1.35}
.navitem:hover{background:var(--card)}
.navitem.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.navnum{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);padding-top:3px;min-width:20px}
.navitem.done .navnum{color:var(--ok)}
.navitem.done .navnum::after{content:' ✓'}

/* ---------- header of module ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
h1{font-size:clamp(30px,4.5vw,44px);font-weight:900;letter-spacing:-.015em;line-height:1.08;margin-bottom:12px}
.tagline{font-size:19px;color:var(--ink-soft);font-style:italic;margin-bottom:26px;max-width:640px}
h2{font-size:23px;font-weight:700;margin:38px 0 12px;letter-spacing:-.01em}
h2 .k{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px}
p{margin-bottom:12px}
strong{font-weight:700}

/* ---------- analogy stage (signature) ---------- */
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin:6px 0 8px}
.stage svg{display:block;width:100%;height:auto}
.stage-cap{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);padding:10px 16px;border-top:1px dashed var(--line)}
.analogy-box{background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:0 10px 10px 0;padding:16px 18px;margin:16px 0}
.analogy-box .albl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}

/* ---------- concept cards ---------- */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ccard h4{font-size:15.5px;font-weight:700;margin-bottom:5px}
.ccard h4 .cn{font-family:var(--mono);color:var(--bronze);font-weight:500;font-size:11px;margin-right:6px}
.ccard p{font-size:14.5px;color:var(--ink-soft);margin:0;line-height:1.55}

/* ---------- interview Q&A ---------- */
.qa{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:10px 0;overflow:hidden}
.qa-q{width:100%;text-align:left;background:none;border:0;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-family:var(--disp);font-size:16px;font-weight:600;color:var(--ink)}
.qa-q .qm{font-family:var(--mono);font-size:11px;color:var(--gold);background:#FBF3DC;border-radius:6px;padding:3px 7px;white-space:nowrap;margin-top:1px}
.qa-q .chev{margin-left:auto;color:var(--ink-faint);transition:transform .25s;flex:none}
.qa.open .chev{transform:rotate(90deg)}
.qa-a{display:none;padding:2px 16px 16px 16px;color:var(--ink-soft);font-size:15.5px;border-top:1px dashed var(--line)}
.qa.open .qa-a{display:block}
.qa-a .say{background:var(--paper-2);border-radius:9px;padding:10px 13px;margin-top:10px;font-size:14.5px}
.qa-a .say b{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:4px;font-weight:500}

/* ---------- one-liner + pitfalls ---------- */
.oneliner{background:linear-gradient(135deg,#12433B,#0F6B5C);color:#F2F7F5;border-radius:var(--r);padding:20px 22px;margin:26px 0 8px}
.oneliner .olbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#9CC8BD;margin-bottom:8px}
.oneliner p{font-size:18px;font-style:italic;margin:0;line-height:1.5}
.pit{display:flex;gap:10px;background:#FBEFEA;border:1px solid #EBD5CB;border-radius:11px;padding:12px 14px;margin:8px 0;font-size:14.5px;color:#6E4437}
.pit .pi{font-family:var(--mono);color:var(--danger);font-size:11px;padding-top:2px;white-space:nowrap}

/* ---------- footer nav ---------- */
.footnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:44px;border-top:1px solid var(--line);padding-top:22px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:#0C5A4D;color:#fff}
.btn.done-toggle.marked{background:#EAF3EC;border-color:var(--ok);color:var(--ok)}

/* ---------- home ---------- */
.hero-medal{display:flex;gap:8px;margin:18px 0 6px}
.medal{width:14px;height:14px;border-radius:50%}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.home-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:transform .15s, box-shadow .15s}
.home-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.home-card .hcn{font-family:var(--mono);font-size:10.5px;color:var(--bronze);letter-spacing:.12em}
.home-card h3{font-size:17px;font-weight:700;margin:4px 0 5px}
.home-card p{font-size:13.5px;color:var(--ink-soft);margin:0}

/* ---------- svg animation ---------- */
.dotflow{animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-48}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.slide{animation:slide 3.2s linear infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(84px)}}
.rise{animation:rise 3s ease-in-out infinite}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.spin-slow{transform-origin:center;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:blink 1.6s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.fillup{animation:fillup 4s ease-in-out infinite}
@keyframes fillup{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){
  .dotflow,.pulse,.slide,.rise,.spin-slow,.blink,.fillup{animation:none}
}

/* ---------- mock interview ---------- */
.navitem.mock-nav{background:#FBF3DC;color:#8A6D1F;font-weight:600;margin-top:8px;border:1px solid #EBD9A8}
.navitem.mock-nav:hover{background:#F6E9C4}
.navitem.mock-nav.active{background:#F0DFA0;color:#6E5717}
.mock-scope{display:grid;gap:12px;margin:20px 0}
.scope-card{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;font-family:var(--disp)}
.scope-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--gold)}
.scope-card h3{font-size:17px;margin:0 0 3px;font-weight:700}
.scope-card p{font-size:13.5px;color:var(--ink-soft);margin:0;line-height:1.45}
.scope-card .go{font-family:var(--mono);font-size:12px;color:var(--gold);white-space:nowrap}
.track-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tchip{font-family:var(--mono);font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 13px;color:var(--ink-soft)}
.tchip:hover{border-color:var(--teal);color:var(--teal)}
.mock-progress-shell{background:var(--line);height:8px;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.mock-progress-fill{height:100%;background:linear-gradient(90deg,var(--bronze),var(--gold));border-radius:99px;transition:width .3s}
.mock-meta{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.06em;margin-bottom:14px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);margin:14px 0}
.qcard .qsrc{font-family:var(--mono);font-size:11px;color:var(--bronze);letter-spacing:.05em;margin-bottom:12px}
.qcard .qtext{font-size:20px;font-weight:600;line-height:1.36;letter-spacing:-.01em}
.reveal-btn{margin-top:18px;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:13px}
.reveal-btn:hover{background:#0C5A4D}
.mock-answer{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;font-size:15.5px;color:var(--ink-soft);line-height:1.6}
.mock-answer .say{background:var(--paper-2);border-radius:9px;padding:10px 13px;margin-top:12px;font-size:14.5px}
.mock-answer .say b{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:4px;font-weight:500}
.rate-prompt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:16px}
.rate-row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.rate-btn{flex:1;min-width:110px;border-radius:10px;padding:11px 12px;font-size:13px;border:1.5px solid;font-family:var(--mono)}
.rate-btn.n{background:#EAF3EC;border-color:var(--ok);color:#2E5E3C}
.rate-btn.p{background:#FBF3DC;border-color:var(--gold);color:#8A6D1F}
.rate-btn.m{background:#FBEFEA;border-color:var(--danger);color:#6E4437}
.rate-btn:hover{filter:brightness(.96)}
.mock-exit{background:none;border:0;color:var(--ink-faint);font-size:12px;margin-top:16px;text-decoration:underline;font-family:var(--mono)}
.verdict{border-radius:16px;padding:24px;margin:14px 0;color:#fff}
.verdict.ready{background:linear-gradient(135deg,#12433B,#0F6B5C)}
.verdict.almost{background:linear-gradient(135deg,#8A6D1F,#C9A227)}
.verdict.practice{background:linear-gradient(135deg,#7A3B30,#A34E3F)}
.verdict .vlbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
.verdict h2{font-size:26px;margin:0 0 8px;color:#fff;font-weight:900}
.verdict p{margin:0;font-size:15px;opacity:.93;line-height:1.5}
.score-big{font-size:44px;font-weight:900;font-family:var(--disp);line-height:1}
.mock-counts{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.mcount{flex:1;min-width:90px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.mcount .mnum{font-size:24px;font-weight:800;font-family:var(--disp)}
.mcount .mlab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
.breakdown{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.breakdown h4{font-size:14px;margin:0 0 10px;font-weight:700}
.brow{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.brow .bt{flex:1;color:var(--ink-soft)}
.bbar{width:110px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:none}
.bbar span{display:block;height:100%;border-radius:99px}
.brow .bn{font-family:var(--mono);font-size:11px;color:var(--ink-faint);min-width:38px;text-align:right}
.weak-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.wchip{font-family:var(--mono);font-size:12px;background:#FBEFEA;border:1px solid #EBD5CB;border-radius:99px;padding:7px 13px;color:#6E4437}
.wchip:hover{border-color:var(--danger)}

/* ---------- mobile ---------- */
#menubtn{display:none;position:fixed;top:14px;left:14px;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;box-shadow:var(--shadow)}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;width:290px;z-index:40;transform:translateX(-100%);transition:transform .25s}
  aside.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.2)}
  #menubtn{display:block}
  .wrap{padding:64px 18px 80px}
  .cgrid,.home-grid{grid-template-columns:1fr}
}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>
<button id="menubtn" aria-label="Open course menu">☰ Modules</button>
<div id="app">
  <aside id="sidebar"></aside>
  <main><div class="wrap" id="content"></div></main>
</div>
<script>
// ============ DATA ENGINEERING CORE — MODS ============
const TRACKS = [
  {id:'t0', name:'Foundations · Why Data Engineering Exists'},
  {id:'t1', name:'Track 1 · How Data Systems Think'},
  {id:'tmodel', name:'Track 2 · Modeling the Data'},
  {id:'t2', name:'Track 3 · Where Data Lives'},
  {id:'tproc', name:'Track 4 · Processing at Scale'},
  {id:'t3', name:'Track 5 · How Data Moves'},
  {id:'t4', name:'Track 6 · Keeping Data Trustworthy'},
  {id:'tcap', name:'Track 7 · Putting It Together'}
];

const MODS = [
/* ================= 01 OLTP vs OLAP ================= */
{
id:'oltp-olap', num:'01', track:'t1',
title:'OLTP vs OLAP',
tagline:'The restaurant cash counter vs the monthly accountant.',
analogy:{label:'Real-world analogy · The Restaurant',
text:'The <strong>cash counter</strong> handles one order at a time — fast, small, thousands per day, and it must never lose a bill. That is <strong>OLTP</strong>. At month end, the <strong>accountant</strong> sits with ALL the bills and asks big questions: which dish sold most? which weekday is slow? That is <strong>OLAP</strong>. You would never make the accountant stand at the counter — and you would never ask the cashier for a yearly trend.'},
stage:`<svg viewBox="0 0 800 260" role="img" aria-label="OLTP counter versus OLAP accountant diagram">
<rect width="800" height="260" fill="#FFFDF8"/>
<text x="200" y="34" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#0F6B5C" font-weight="700">OLTP · Cash counter</text>
<text x="600" y="34" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#B08D57" font-weight="700">OLAP · Accountant</text>
<rect x="120" y="120" width="160" height="60" rx="10" fill="#E3EFEB" stroke="#0F6B5C" stroke-width="2"/>
<text x="200" y="155" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#0F6B5C">orders table</text>
<path d="M30 150 H115" stroke="#0F6B5C" stroke-width="3" stroke-dasharray="6 6" class="dotflow" fill="none"/>
<circle cx="55" cy="110" r="8" fill="#0F6B5C" class="pulse"/><text x="55" y="92" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#5C5347">INSERT</text>
<circle cx="85" cy="190" r="8" fill="#0F6B5C" class="pulse"/><text x="85" y="215" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#5C5347">UPDATE</text>
<text x="200" y="205" text-anchor="middle" font-size="11.5" font-family="JetBrains Mono" fill="#8A7F6F">1 row at a time · ms latency</text>
<path d="M285 150 H510" stroke="#B08D57" stroke-width="3" stroke-dasharray="6 6" class="dotflow" fill="none"/>
<text x="398" y="138" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#8A7F6F">nightly ETL</text>
<rect x="515" y="95" width="170" height="110" rx="10" fill="#FBF3DC" stroke="#B08D57" stroke-width="2"/>
<text x="600" y="130" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#7A6230">warehouse</text>
<text x="600" y="152" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#7A6230">GROUP BY month</text>
<text x="600" y="172" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#7A6230">scan millions of rows</text>
<rect x="700" y="110" width="10" height="60" fill="#C9A227" class="fillup" style="transform-origin:705px 170px"/>
<rect x="716" y="130" width="10" height="40" fill="#B08D57" class="fillup" style="transform-origin:721px 170px;animation-delay:.5s"/>
<rect x="732" y="120" width="10" height="50" fill="#9BA3AD" class="fillup" style="transform-origin:737px 170px;animation-delay:1s"/>
</svg>`,
body:`<p><strong>OLTP (Online Transaction Processing)</strong> systems run the business: bookings, payments, signups. They are optimized for many tiny reads/writes on individual rows, with strict correctness (ACID). Think MySQL, PostgreSQL, Oracle behind an app.</p>
<p><strong>OLAP (Online Analytical Processing)</strong> systems understand the business: trends, aggregates, dashboards. They are optimized to scan huge volumes of history and crunch it. Think BigQuery, Snowflake, Redshift. Data engineering largely exists to move data from OLTP-land to OLAP-land without breaking anything.</p>`,
concepts:[
 {t:'Workload shape', d:'OLTP = many small, concurrent transactions touching a few rows. OLAP = few large queries scanning millions of rows.'},
 {t:'Storage layout', d:'OLTP databases are usually row-oriented; OLAP engines are usually columnar — this single fact explains most performance differences.'},
 {t:'Normalization', d:'OLTP schemas are normalized (3NF) to avoid duplicate writes; OLAP schemas are denormalized (star schema) to avoid expensive joins at read time.'},
 {t:'Never mix them', d:'Running heavy analytics on the production OLTP database slows real customers down — the classic reason companies build a warehouse in the first place.'}
],
qa:[
 {q:'What is the difference between OLTP and OLAP?', a:'OLTP handles the operational transactions of a business — small, fast, frequent reads and writes with ACID guarantees. OLAP handles analytical workloads — large scans and aggregations over historical data. They differ in workload shape, storage layout (row vs columnar), schema design (normalized vs star), and users (applications vs analysts).', say:'"OLTP runs the business, OLAP understands the business."'},
 {q:'Why not just run analytics on the production database?', a:'Three reasons: (1) analytical scans compete with customer transactions for CPU/IO and can take the app down, (2) row-oriented storage is terribly slow for aggregations, and (3) production schemas are normalized for writes, so analysts would need dozens of joins. So we replicate/ETL data into a separate analytical store.', say:'"The accountant should never block the cash counter."'},
 {q:'What is a star schema and why is it used in OLAP?', a:'A star schema has a central fact table (events/measurements like orders, with numeric measures) surrounded by dimension tables (who/what/where/when — customer, product, date). It trades storage duplication for fast, simple queries: one join hop from fact to any dimension, which analysts and BI tools handle easily.', say:'"Facts are verbs, dimensions are nouns."'},
 {q:'Where do HTAP or systems like AlloyDB / SingleStore fit in?', a:'HTAP (Hybrid Transactional/Analytical Processing) systems try to serve both workloads from one engine, usually by keeping a row store for writes and a columnar replica for analytics under the hood. Good for real-time operational analytics; but for large-scale, cross-source analytics, a dedicated warehouse or lakehouse still wins.', say:'"HTAP doesn\'t remove the row-vs-column tradeoff — it hides it inside one product."'}
],
oneLiner:'OLTP is thousands of tiny receipts written perfectly; OLAP is one accountant reading all of them at once. Separate systems, because separate physics.',
pitfalls:['Saying "OLAP is just a bigger database" — the storage layout (columnar) and schema style (star) are the real differences.','Forgetting ACID: interviewers often follow up with "what does ACID stand for" (Atomicity, Consistency, Isolation, Durability).']
},

/* ================= 02 ETL vs ELT ================= */
{

title:'ETL vs ELT',

analogy:{label:'Real-world analogy · Two Kitchens',
text:'<strong>ETL</strong> is cooking at home before a potluck: you chop, cook, and plate (Transform) in your small kitchen, then carry the finished dish (Load) to the party. <strong>ELT</strong> is a five-star hotel: trucks dump raw groceries straight into a massive industrial kitchen (Load first), and an army of chefs transforms them <em>inside</em>, whenever each dish is needed. When the kitchen (warehouse) is powerful and cheap, it makes sense to bring everything raw and cook on-site.'},

<text x="610" y="228" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#7A6230">(SQL / dbt)</text>
<circle cx="520" cy="240" r="5" fill="#C9A227" class="pulse"/><circle cx="540" cy="240" r="5" fill="#C9A227" class="pulse" style="animation-delay:.4s"/><circle cx="560" cy="240" r="5" fill="#C9A227" class="pulse" style="animation-delay:.8s"/>
</svg>`,
body:`<p><strong>ETL</strong>: Extract from sources → Transform on a dedicated processing layer (Informatica, Spark cluster) → Load only the clean result into the target. Historically necessary because warehouses were expensive and weak.</p>
<p><strong>ELT</strong>: Extract → Load the <em>raw</em> data into a cheap, powerful cloud warehouse/lake → Transform there using SQL (dbt is the poster child). Raw data is preserved, transformations are replayable, and the warehouse's own compute does the heavy lifting. Modern cloud stacks default to ELT; ETL survives where data must be cleansed/masked <em>before</em> it lands (PII, compliance) or where sources are too messy to load directly.</p>`,
concepts:[
 {t:'Order is the difference', d:'Same three steps — the only question is whether Transform happens before or after landing in the target system.'},
 {t:'Why ELT won the cloud', d:'Cloud warehouses separated storage from compute and made both cheap and elastic, so transforming in-place became simpler than maintaining a separate transform tier.'},
 {t:'Raw data is an asset', d:'ELT keeps the untouched raw copy, so when logic changes you re-run transforms on history — impossible in classic ETL where raw was thrown away.'},
 {t:'ETL still matters', d:'Regulatory masking, tokenizing PII before landing, or heavy unstructured parsing (images, logs) still favor transform-first pipelines.'}
],
qa:[
 {q:'Explain ETL vs ELT. Which would you choose today?', a:'Both extract data and land it in an analytical store; the difference is where transformation runs. ETL transforms on a separate engine before loading; ELT loads raw data first and transforms inside the warehouse. Today I default to ELT on cloud platforms — raw data is preserved, transformations are versioned SQL (dbt), and the warehouse scales the compute — but I use ETL-style pre-processing when PII must be masked before landing or when data needs heavy parsing.', say:'"ELT by default, ETL by exception."'},
 {q:'Why did the industry shift from ETL to ELT?', a:'Economics. On-prem warehouses had costly, fixed compute, so you cleaned data before letting it in. Cloud warehouses (BigQuery, Snowflake) decoupled cheap storage from elastic compute, so loading everything raw became affordable, and SQL-based transformation inside the warehouse became faster to develop and easier to audit than external ETL jobs.', say:'"When the kitchen became industrial-sized, we stopped cooking at home."'},
 {q:'What is dbt and where does it fit?', a:'dbt (data build tool) is the standard T in ELT: SQL SELECT statements version-controlled like software, compiled into tables/views inside the warehouse, with built-in dependency graphs, tests, and documentation. It brought software engineering discipline — code review, CI, modularity — to warehouse transformations.', say:'"dbt made analysts write transformations like engineers write code."'},
 {q:'If raw data lands first in ELT, how do you handle sensitive data?', a:'Options: mask/tokenize PII in-flight before landing (a thin ETL step), land into a restricted raw zone with tight IAM and column-level security, or use warehouse features like dynamic data masking and policy tags. The key point is that "load raw first" never means "load unprotected."', say:'"Raw doesn\'t mean unguarded — the raw zone is the most locked-down layer, not the least."'}
],
oneLiner:'ETL cooks before delivering; ELT delivers groceries and cooks inside the warehouse. Cheap cloud compute is why the industry moved the kitchen.',
pitfalls:['Claiming ETL is "obsolete" — interviewers may probe compliance/PII cases where transform-first is required.','Forgetting to mention dbt when asked about modern ELT — it is the expected answer.']
},

/* ================= 03 Lake / Warehouse / Lakehouse ================= */
{
id:'lake-wh', num:'03', track:'t2',
title:'Data Lake vs Warehouse vs Lakehouse',
tagline:'The garage, the library, and the library with a smart garage attached.',
analogy:{label:'Real-world analogy · Storing Your Stuff',
text:'A <strong>data lake</strong> is your garage: throw anything in — boxes, bikes, photos (any format, dirt cheap), but finding something specific is painful. A <strong>warehouse</strong> is a library: everything catalogued, labelled, on the right shelf (structured, fast to query) — but the librarian only accepts properly formatted books, and shelf space costs more. A <strong>lakehouse</strong> is a library-grade catalog system installed <em>on top of the garage</em>: keep the cheap open storage, add an index, transactions, and rules so you can query the garage like a library.'},
stage:`<svg viewBox="0 0 800 300" role="img" aria-label="Lake, warehouse, lakehouse comparison">
<rect width="800" height="300" fill="#FFFDF8"/>

<text x="660" y="150" text-anchor="middle" font-size="10" font-family="JetBrains Mono" fill="#0F6B5C" class="pulse">ACID table format layer</text>
<text x="660" y="215" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#5C5347">open files + catalog + ACID</text>
</svg>`,
body:`<p><strong>Data lake</strong>: object storage (GCS, S3, ADLS) holding files in open formats — CSV, JSON, Parquet, images. Infinitely scalable and cheap, schema-on-read, but with no transactions or governance it degrades into a "data swamp."</p>
<p><strong>Data warehouse</strong>: a managed analytical database (BigQuery, Snowflake) with schema-on-write, strong SQL performance, ACID, and governance — but proprietary storage and higher cost for raw/unstructured data.</p>
<p><strong>Lakehouse</strong>: open table formats — <strong>Delta Lake, Apache Iceberg, Apache Hudi</strong> — add a transaction log over Parquet files in the lake, giving ACID, schema enforcement, time travel, and updates/deletes. One copy of data, many engines (Spark, Trino, BigQuery, Snowflake) can query it.</p>`,
concepts:[
 {t:'Schema-on-write vs schema-on-read', d:'Warehouse validates structure when data enters (write); lake applies structure only when you query (read). Lakehouse lets you choose per table.'},
 {t:'Open table formats', d:'Iceberg/Delta/Hudi = metadata + transaction log over Parquet. This log is what turns dumb files into ACID tables with time travel.'},
 {t:'Separation of storage & compute', d:'Data sits in cheap object storage; any engine spins up compute against it. No copies, no lock-in — the core lakehouse promise.'},
 {t:'The swamp warning', d:'A lake without catalog, ownership, and quality checks becomes a swamp. Governance is what separates a lake from a landfill.'}
],
qa:[
 {q:'Compare data lake, data warehouse, and lakehouse.', a:'A lake is cheap object storage for any format with schema-on-read — flexible but ungoverned. A warehouse is a managed SQL engine with schema-on-write — fast and governed but costlier and structured-only. A lakehouse layers an open table format (Delta/Iceberg/Hudi) over lake storage to get warehouse-like ACID, schema enforcement, and performance on open files, so one copy of data serves BI and ML together.', say:'"Lake = cheap and flexible, warehouse = fast and governed, lakehouse = both, on open files."'},
 {q:'What problem do Delta Lake / Iceberg actually solve?', a:'Plain Parquet files on object storage have no transactions: concurrent writers corrupt each other, updates require rewriting entire folders, and readers can see half-written data. Table formats add a transaction log/metadata layer providing ACID commits, safe concurrent writes, row-level updates/deletes (crucial for GDPR), schema evolution, and time travel to past versions.', say:'"They turn a folder of files into a database table."'},
 {q:'What is time travel and when have you used it?', a:'Table formats keep previous snapshots, so you can query the table AS OF a timestamp/version. Uses: debugging ("what did the table look like before last night\'s job?"), reproducing ML training data, auditing, and instant rollback of a bad write instead of restoring backups.', say:'"Time travel makes \'oops\' a query, not an incident."'},
 {q:'When would you still pick a pure warehouse?', a:'When the team is SQL-centric, data is structured, volumes are moderate, and operational simplicity matters more than open formats — a managed warehouse like BigQuery gives excellent performance with near-zero ops. Lakehouse shines with very large volumes, mixed formats, ML workloads, and multi-engine access.', say:'"Don\'t build a lakehouse to prove a point — build it because multiple engines need one copy of big, mixed data."'}
],
oneLiner:'Garage, library, or a garage with a library catalog bolted on — the lakehouse exists because companies got tired of paying for both.',
pitfalls:['Calling the lakehouse "a lake plus a warehouse" (two systems). It is one storage layer with a table format on top.','Not naming Delta/Iceberg/Hudi — interviewers expect at least two of the three.']
},

/* ================= 04 Medallion ================= */
{
id:'medallion', num:'04', track:'t2',
title:'Medallion Architecture',
tagline:'A water purification plant: raw river water → filtered → bottled.',
analogy:{label:'Real-world analogy · Water Purification',
text:'A city water plant never pipes river water straight to homes. <strong>Bronze</strong> is the intake reservoir: raw river water, exactly as it arrived, mud and all — kept so you can always trace back. <strong>Silver</strong> is the filtration stage: cleaned, deduplicated, tested, standardized. <strong>Gold</strong> is bottled water on shelves: packaged for a specific consumer — drinking, hospital-grade, industrial. Same water, increasing trust at each stage.'},

<text x="660" y="235" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#8A7F6F" class="pulse">bottled water</text>
</svg>`,
body:`<p>Medallion (Bronze/Silver/Gold) is a <strong>layered refinement pattern</strong> for lakes and lakehouses. Each layer has a contract:</p>
<p><strong>Bronze</strong> — raw, immutable, append-only data exactly as ingested, plus metadata (source, load timestamp). Its job is <em>replayability and audit</em>. <strong>Silver</strong> — cleaned and conformed: types fixed, duplicates removed, quality rules applied, entities standardized and joined. Its job is <em>a trustworthy single version of each entity</em>. <strong>Gold</strong> — business-level aggregates and marts shaped for specific consumers: dashboards, ML features, finance reports. Its job is <em>consumption</em>.</p>`,
concepts:[
 {t:'Bronze is insurance', d:'If transformation logic has a bug, you rebuild Silver/Gold from Bronze. Never edit Bronze — it is your replay log.'},
 {t:'Quality gates between layers', d:'Data earns promotion: validation rules decide what moves from Bronze to Silver. Failures go to quarantine, not silently forward.'},
 {t:'Consumers read Gold (mostly)', d:'Analysts and dashboards read Gold; data scientists sometimes reach into Silver; nobody builds reports on Bronze.'},
 {t:'Layers ≠ three copies of everything', d:'Gold is selective — only what the business needs, aggregated. Medallion is refinement, not triplication.'}
],
qa:[
 {q:'Explain the medallion architecture. Why three layers?', a:'It structures a lakehouse into progressive quality tiers: Bronze holds raw immutable data for auditability and replay; Silver holds cleaned, deduplicated, conformed entities as the single source of truth; Gold holds business-ready aggregates per consumer. Three layers separate concerns — ingestion reliability, data quality, and business logic — so each can change independently and any layer can be rebuilt from the one below.', say:'"Each layer answers a different question: what arrived, what\'s true, and what the business needs."'},
 {q:'A stakeholder reports a wrong number in a Gold dashboard. Walk me through debugging with medallion.', a:'Trace lineage backwards: check the Gold aggregation logic first, then whether Silver holds correct cleaned records for those keys, then compare against the raw Bronze payload. Because Bronze is immutable, you can prove whether the source sent bad data or your pipeline introduced the error — and after fixing logic, replay from Bronze to rebuild downstream layers.', say:'"Bronze immutability means every bug is provable: either they sent it wrong, or we transformed it wrong."'},
 {q:'Should Bronze data ever be modified or deleted?', a:'As a rule, never modified — append-only. Deletions happen only for compliance (GDPR right-to-be-forgotten) or retention policies, done through controlled processes (table-format deletes with audit trail). Any "fix" belongs in Silver logic, not in rewriting history.', say:'"Bronze is a ledger, not a whiteboard."'},
 {q:'How does medallion relate to data quality?', a:'The layer boundaries are natural quality gates: schema checks and completeness at Bronze→Silver, business rules and referential integrity at Silver→Gold. Records failing validation route to quarantine tables with reasons, and metrics on pass rates become your data-quality dashboard.', say:'"Promotion between layers is earned by passing tests, like water passing purity checks."'}
],
oneLiner:'Bronze remembers everything, Silver cleans everything, Gold serves everyone — and because Bronze is immutable, you can always rebuild the plant from the river.',
pitfalls:['Treating layers as "copy the same tables three times" — Gold is shaped per use case, not a clone.','Letting consumers query Bronze "temporarily" — it becomes permanent and defeats the architecture.']
}
];

body:`<p>Before any pipeline, three ideas: what data <em>is</em>, what <em>shape</em> it comes in, and why turning it into value takes a whole engineering discipline.</p>
<p><strong>The DIKW ladder</strong> — data climbs from raw to useful. <span class="mono">37.2</span> is <strong>Data</strong> (a raw fact). "Patient temperature is 37.2°C" is <strong>Information</strong> (fact in context). "37.2 is normal, 39 is a fever" is <strong>Knowledge</strong> (patterns across information). "Send this patient home" is <strong>Wisdom</strong> — the decision. Data engineering builds the machinery that moves data up this ladder <em>reliably and at scale</em>.</p>
<p><strong>The three shapes of data:</strong> <strong>Structured</strong> fits neat rows and columns with a fixed schema — SQL tables, CSV (the filing cabinet of identical forms). <strong>Semi-structured</strong> has some structure but flexes — JSON, XML, logs, emails (every email has sender and date, but the body is freeform). <strong>Unstructured</strong> has no schema at all — images, video, audio, free text, PDFs (a shoebox of photos and voice notes). Most new data today is semi- or unstructured, which is exactly what modern AI feeds on.</p>
<p><strong>Why it is a discipline, not a task:</strong> valuable data is scattered across dozens of systems, arrives at billions of events, in every format, at real-time speed, and of questionable quality. Making it unified, trustworthy, timely, and usable is beyond any single database or person — it is engineering.</p>`,
concepts:[
 {t:'DIKW: data → decision', d:'Raw facts are useless until given context (information), pattern (knowledge), and action (wisdom). DE is the machinery that climbs the ladder at scale.'},
 {t:'Structured / semi / unstructured', d:'Rows-and-columns, flexible-JSON, and no-schema-at-all. Structured is the minority; unstructured is the fast-growing majority and the fuel for AI.'},
 {t:'Why a whole discipline', d:'Scale, spread, speed, and quality of modern data outgrew what DBAs and app developers could handle as a side job — so a dedicated role emerged.'},
 {t:'Data is worth its decision', d:'Data has no value in itself — only the decision or product it enables. DE exists to shorten the path from raw event to reliable decision.'}
],
qa:[
 {q:'Why do we need data engineering at all?', a:'Because valuable data is scattered across many systems, in incompatible formats, at different freshness, of unknown quality, and at a scale too large for one machine or person to wrangle by hand. Data engineering builds the reliable pipelines and storage that unify, clean, and serve that data so analysts, dashboards, and ML models can actually use it. Without it, every analyst re-invents brittle extracts and nobody trusts the numbers.', say:'"Data scientists can\'t run models on crude data any more than a car runs on crude oil — engineering is the refinery."'},
 {q:'What is the difference between structured, semi-structured, and unstructured data?', a:'Structured data fits a fixed schema of rows and columns (SQL tables, CSV). Semi-structured data has a flexible, self-describing structure — fields exist but vary from record to record (JSON, XML, logs). Unstructured data has no schema at all (images, audio, video, free text, PDFs). The industry trend is that most new data is semi- or unstructured, which is why data lakes and flexible formats became essential.', say:'"Filing cabinet, stack of emails, shoebox of photos."'},
 {q:'What is the DIKW hierarchy — how does data become value?', a:'Data is raw facts, Information is data placed in context, Knowledge is patterns recognized across information, and Wisdom is the decision it drives. A temperature reading is data; "the patient\'s temperature is 39°C" is information; "39 means a fever" is knowledge; "admit them" is wisdom. Data engineering builds the reliable machinery that moves data up this ladder at scale, so the business can act on it.', say:'"A number, then a number that means something, then a number you can act on."'},
 {q:'How is a data engineer different from a data scientist, analyst, or DBA?', a:'A DBA keeps a single database healthy, tuned, and available. A data engineer builds pipelines and platforms that move and shape data across many systems for analytics and ML. A data scientist or analyst consumes that prepared data to model, visualize, and find insight. Rough split: engineers build the roads and refineries; scientists and analysts drive on them. The lines blur, but DE owns the data\'s reliability, scale, and journey.', say:'"Engineers build and maintain the pipes; scientists and analysts drink the water."'}
],
oneLiner:'Raw data is crude oil — abundant, scattered, and useless until refined. Data engineering is the well, the refinery, and the pipeline that turns it into fuel for every decision and every model.',
pitfalls:['Saying "data engineering is just writing ETL scripts" — it is the whole reliability, scale, and quality discipline, not a single task.','Confusing a data engineer with a DBA — a DBA tends one database; an engineer moves data across many systems at scale.']
},

/* ================= F2 · Big Data & the Three Vs ================= */
{

title:'Big Data & the Three Vs',
tagline:'The day "just buy a bigger server" stopped working.',
analogy:{label:'Real-world analogy · The Overflowing Warehouse',
text:'A growing shop stores stock in a back room. As business grows you get a bigger room, then a bigger building — for a while, "buy more space" works. But one day stock arrives <strong>faster</strong> than you can shelve it, in items too <strong>varied</strong> for your shelving system, in a <strong>quantity</strong> no single building can hold. You can\'t just "get a bigger building" anymore — you need a <em>network</em> of warehouses and a fleet of trucks. That breaking point — when scaling up one place stops working and you must scale <em>out</em> across many — is exactly what the term <strong>"big data"</strong> named.'},

body:`<p><strong>"Big data" is not just "a lot of data."</strong> It is data whose <em>Volume, Velocity, or Variety</em> exceeds what a traditional single-machine database can handle — forcing a fundamentally different, distributed approach. A tidy 500&nbsp;GB table on one server is not big data; a petabyte of mixed logs and images arriving at millions of events per second is.</p>
<p><strong>The three Vs</strong> (Doug Laney, ~2001): <strong>Volume</strong> — sheer scale (terabytes to petabytes) that one machine\'s disk and memory can\'t hold or process. <strong>Velocity</strong> — the speed data arrives and must be handled (nightly batch versus millions of events per second, real-time). <strong>Variety</strong> — the mix of formats (structured tables + JSON + logs + images + video) that rigid schemas can\'t absorb.</p>
<p>Often extended with two more: <strong>Veracity</strong> (trustworthiness and uncertainty — can you rely on it?) and <strong>Value</strong> (does it actually create worth — the entire point). The core shift big data forced was <strong>scale-up vs scale-out</strong>: buying one ever-bigger machine (vertical) hits a hard ceiling; distributing across many cheap commodity machines (horizontal) does not. That single choice is why Hadoop, Spark, and distributed storage exist.</p>`,
concepts:[
 {t:'Volume · Velocity · Variety', d:'The three axes that define big data — how much, how fast, how varied. Exceeding any one of them breaks single-machine tools.'},
 {t:'Veracity & Value', d:'The two Vs added later: is the data trustworthy, and does it actually create worth? Volume without Value is just an expensive landfill.'},
 {t:'Scale-up vs scale-out', d:'Vertical = a bigger single machine (simple, but a ceiling and a single point of failure). Horizontal = many commodity machines (near-limitless, fault-tolerant). Big data chose scale-out.'},
 {t:'Not "lots of rows"', d:'Big data is the moment traditional databases break on volume, speed, or format diversity — the trigger for distributed systems, not merely a big table.'}
],
qa:[
 {q:'What actually is "big data"? Isn\'t it just a large database?', a:'No. Big data describes data whose volume, velocity, or variety exceeds what a single traditional machine or database can handle, forcing distributed, scale-out systems. A large but well-structured 500 GB table on one server isn\'t big data; a petabyte of mixed logs and images arriving at millions of events per second is. The defining feature is that scaling up one machine no longer works.', say:'"It\'s not the size of the data — it\'s the moment one machine gives up."'},
 {q:'Explain the Vs of big data.', a:'Volume — scale, from terabytes to petabytes, too big for one machine. Velocity — the speed of arrival and processing, from nightly batch to real-time streams. Variety — format diversity, from structured tables to JSON, logs, images, and video. These are often extended with Veracity (trustworthiness and uncertainty) and Value (whether it drives real worth, which is the whole point).', say:'"Volume, Velocity, Variety — how much, how fast, how varied — plus Veracity and Value."'},
 {q:'What is the difference between scaling up and scaling out, and why did big data force scaling out?', a:'Scaling up (vertical) means a bigger single machine — more CPU, RAM, and disk; it\'s simple but hits a hard, expensive ceiling and remains a single point of failure. Scaling out (horizontal) means distributing data and compute across many cheap commodity machines; it\'s near-limitless and fault-tolerant, but harder to program. Big data volumes blew past any single machine, so the industry moved to scale-out — which is precisely why Hadoop, Spark, and distributed storage were created.', say:'"You can only buy so big a truck; eventually you need a fleet."'},
 {q:'Why couldn\'t traditional relational databases handle big data?', a:'Relational databases assume data fits on one machine (or a tightly coupled few), enforce a rigid schema up front, and scale mainly by buying bigger hardware. Big data broke all three assumptions: volumes exceeded single machines, velocity outpaced transactional writes, and variety — JSON, logs, images — didn\'t fit fixed schemas. This drove distributed file systems, schema-on-read, and parallel processing frameworks.', say:'"Rigid schema, single machine, scale-up — big data violated all three at once."'}
],
oneLiner:'Big data is the day "just buy a bigger server" stopped working — when volume, velocity, and variety forced us to spread data across a fleet of machines instead of one.',
pitfalls:['Defining big data as merely "a lot of data" — the real answer is exceeding single-machine limits on volume, velocity, or variety.','Listing only three Vs when asked about "the Vs" without knowing Veracity and Value exist as common extensions.']
},

/* ================= F3 · How Data Engineering Evolved ================= */
{
id:'evolution', num:'03', track:'t0',
title:'How Data Engineering Evolved',
tagline:'Mainframes → warehouses → Hadoop → cloud → today. Five eras, each removing the last one\'s ceiling.',
analogy:{label:'Real-world analogy · The Growing City',
text:'Data infrastructure grew like a city. First a village with a <strong>single well</strong> — one database serving everything. As it grew, a dedicated <strong>warehouse district</strong> appeared to store and organize goods (data warehouses). Then explosive growth overwhelmed the old roads — too many people, too much traffic, too many kinds of goods — so the city had to rebuild with entirely new infrastructure (the <strong>Hadoop / big-data rebuild</strong>). Then utilities went <strong>on-demand</strong>: instead of owning generators, you rent power that scales instantly (the <strong>cloud</strong>). Each era wasn\'t a fad — it solved the exact ceiling the previous era hit.'},
stage:`<svg viewBox="0 0 800 300" role="img" aria-label="Timeline of data engineering eras">
<rect width="800" height="300" fill="#FFFDF8"/>
<line x1="60" y1="150" x2="740" y2="150" stroke="#E4DCCB" stroke-width="3"/>

<text x="400" y="190" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#5C5347">Hadoop</text>

<text x="545" y="205" text-anchor="middle" font-size="9" font-family="JetBrains Mono" fill="#8A7F6F">storage ≠ compute</text>

<circle cx="690" cy="150" r="13" fill="#0F6B5C" class="pulse"/>
<circle cx="690" cy="150" r="6" fill="#FFFDF8"/>
<text x="690" y="115" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#0F6B5C" font-weight="700">2020s · now</text>

<text x="690" y="205" text-anchor="middle" font-size="9" font-family="JetBrains Mono" fill="#8A7F6F">lakehouse · LLMs</text>
<text x="400" y="262" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#8A7F6F" class="pulse">each era decoupled what the last one glued together</text>
</svg>`,
body:`<p>Five eras, each triggered by the previous one hitting a wall (usually the three Vs).</p>
<p><strong>1 · Databases &amp; mainframes (1970s–80s).</strong> Codd\'s relational model and SQL; one system ran both daily operations and the occasional report. <em>Ceiling:</em> reports crushed the operational database, and there was no room to keep history.</p>
<p><strong>2 · Data warehousing (1990s).</strong> Dedicated analytical databases, separate from operations. Kimball (dimensional / star schemas) and Inmon (enterprise warehouse) defined the discipline; ETL tools loaded data nightly. <em>Ceiling:</em> expensive proprietary hardware, rigid schemas, and no way to handle unstructured or internet-scale data.</p>
<p><strong>3 · The big-data / Hadoop era (mid-2000s–2010s).</strong> Google\'s papers — GFS (2003), MapReduce (2004), BigTable (2006) — inspired <strong>Hadoop</strong>: HDFS to store petabytes across cheap commodity machines, MapReduce to process them, "bring the compute to the data." Hive added SQL on top. <em>Ceiling:</em> MapReduce was slow (disk-heavy, batch-only) and hard to program, and running your own cluster was operationally brutal.</p>
<p><strong>4 · The cloud &amp; Spark era (2010s).</strong> The <strong>cloud</strong> rented infinite infrastructure on demand and, crucially, <strong>separated storage from compute</strong> (object storage + elastic clusters). <strong>Apache Spark</strong> replaced MapReduce with fast in-memory processing, and managed cloud warehouses (Redshift in 2012, then BigQuery and Snowflake) made petabyte-scale SQL a service. <em>Ceiling removed:</em> no more owning clusters; pay for what you use; scale storage and compute independently.</p>
<p><strong>5 · The modern stack &amp; today (2020s).</strong> ELT + dbt, the <strong>lakehouse</strong> (Delta / Iceberg) merging lake and warehouse, streaming as a default, orchestration, quality and observability, governance and data mesh — and now pipelines feeding <strong>AI, ML, and LLMs</strong>. The frontier is real-time everything, with data as the fuel for AI.</p>
<p><strong>The through-line:</strong> every era decoupled or distributed something the last one had glued together — operations from analytics, then schema from storage, then compute from storage, and now producing from consuming — always pushed by the three Vs breaking the previous ceiling.</p>`,
concepts:[
 {t:'Warehouse era (1990s)', d:'Separated analytics from operations; Kimball & Inmon; nightly ETL — but proprietary, rigid, and structured-only.'},
 {t:'Hadoop era (2000s)', d:'Google\'s GFS/MapReduce papers → HDFS + MapReduce; scale-out on commodity hardware; "bring compute to data" — but slow and operationally heavy.'},
 {t:'Cloud & Spark era (2010s)', d:'On-demand infrastructure, storage/compute separation, in-memory Spark, and managed cloud warehouses — the model most teams still use today.'},
 {t:'The through-line', d:'Every era decoupled what the last one coupled: ops↔analytics, schema↔storage, compute↔storage, producer↔consumer — always driven by the three Vs.'}
],
qa:[
 {q:'Walk me through how data engineering evolved.', a:'Five eras. (1) 1970s–80s: databases and mainframes ran operations and reports on one system. (2) 1990s: data warehouses separated analytics from operations, with dimensional modeling (Kimball/Inmon) and nightly ETL. (3) Mid-2000s: Hadoop, inspired by Google\'s GFS and MapReduce papers, brought scale-out storage and processing on commodity hardware for internet-scale, unstructured data. (4) 2010s: the cloud rented infinite infrastructure and separated storage from compute, with Spark replacing slow MapReduce and managed warehouses like BigQuery and Snowflake. (5) Today: the modern stack — ELT/dbt, lakehouse, streaming, orchestration, and pipelines feeding AI. Each era solved the previous one\'s ceiling.', say:'"Every era decoupled something the last one glued together — and the three Vs kept pushing."'},
 {q:'Why did Hadoop emerge, and why did its usage decline?', a:'It emerged because internet-scale companies had data too big and varied for warehouses, and Google\'s GFS/MapReduce papers showed how to store and process petabytes across cheap commodity machines by scaling out. It declined because MapReduce was slow — disk-heavy and batch-only — and painful to program, while running your own cluster was operationally heavy. Spark (in-memory, faster, friendlier APIs) and cloud managed services (which separate storage and compute and remove the ops burden) delivered the same scale without the pain.', say:'"Hadoop proved scale-out worked; Spark and the cloud made it fast and painless."'},
 {q:'What did separating storage from compute change?', a:'In on-prem warehouses and early Hadoop, storage and compute were coupled — to store more you added machines that also carried compute, so you over-provisioned one just to get the other. Cloud object storage plus elastic compute decoupled them: store petabytes cheaply and indefinitely, spin up compute only when querying and only as much as needed, and let many engines read the same data. This is the foundation of cloud warehouses and the lakehouse, and it\'s why cost and scaling became independent.', say:'"You stopped paying for a bigger truck just to get a bigger garage."'},
 {q:'Why is Spark preferred over MapReduce?', a:'MapReduce writes intermediate results to disk between every step, making multi-stage jobs slow, and its rigid map-then-reduce model is verbose for complex logic. Spark keeps intermediate data in memory, uses a DAG execution engine that optimizes multi-step pipelines, and offers high-level APIs — DataFrames and SQL — plus streaming and ML in one framework. The result is typically far faster and much easier to write.', say:'"MapReduce touches disk between every step; Spark keeps the work in memory."'}
],
oneLiner:'Data engineering grew like a city outgrowing its roads — mainframe to warehouse to Hadoop to cloud to today\'s AI-fueled stack — and every era simply removed the ceiling the last one hit.',
pitfalls:['Treating the eras as fads rather than each solving a real ceiling — volume, cost, operational burden, or speed.','Not knowing the Google papers (GFS, MapReduce, BigTable) inspired Hadoop — a common senior follow-up.','Saying "Hadoop is dead" flatly — the scale-out idea and HDFS/YARN concepts live on; it\'s the specific MapReduce-plus-self-managed-cluster model that faded.']
}
);

{
id:'batch-stream', num:'05', track:'t3',
title:'Batch vs Streaming',
tagline:'The postal van that comes once a day vs the water pipe that never stops.',
analogy:{label:'Real-world analogy · Post vs Plumbing',
text:'<strong>Batch</strong> is the postal van: letters accumulate all day, then one van delivers the whole bundle at 6 PM. Efficient per letter, but the news is hours old. <strong>Streaming</strong> is your water tap: a continuous pipe where each drop arrives seconds after leaving the source. You don\'t plumb a pipe to send a birthday card, and you don\'t wait for tomorrow\'s van when the house is on fire — <em>latency requirements decide</em>, not fashion.'},

<text x="400" y="265" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#5C5347">each event processed within seconds of occurring</text>
</svg>`,
body:`<p><strong>Batch</strong>: process bounded chunks on a schedule (hourly, nightly). Tools: Spark, BigQuery scheduled queries, Composer/Airflow-orchestrated jobs. High throughput, simple to reason about, latency = schedule interval.</p>
<p><strong>Streaming</strong>: process unbounded events as they arrive. Tools: Kafka/PubSub for transport, Flink/Spark Structured Streaming/Dataflow for processing. Seconds of latency, but you inherit hard problems: late events, out-of-order data, exactly-once semantics, and state management.</p>
<p><strong>Micro-batching</strong> (Spark Structured Streaming\'s classic mode) runs tiny batches every few seconds — a pragmatic middle that covers many "near-real-time" needs.</p>`,
concepts:[
 {t:'Latency drives the choice', d:'Fraud detection needs seconds → stream. Monthly finance report needs correctness, not speed → batch. Start from the business SLA.'},
 {t:'Event time vs processing time', d:'When it happened vs when you saw it. Networks delay events, so streams use watermarks to decide how long to wait for stragglers.'},
 {t:'Windows', d:'Streams aggregate over windows: tumbling (fixed, non-overlapping), sliding (overlapping), session (gap-based). Know all three by name.'},
 {t:'Streaming costs more', d:'Always-on infrastructure, state stores, harder testing and ops. Default to batch; stream only when the use case pays for it.'}
],
qa:[
 {q:'When would you choose streaming over batch?', a:'When the value of data decays in seconds or minutes: fraud detection, live personalization, operational monitoring, inventory sync. If consumers look at data hourly or daily — most BI and reporting — batch is cheaper, simpler, and easier to make correct. I ask "what decision is made, and how fresh must data be for it?" before choosing.', say:'"Choose the pipe when the house can catch fire; choose the van for everything else."'},
 {q:'Explain event time vs processing time, and watermarks.', a:'Event time is when something actually happened (in the payload); processing time is when the pipeline sees it. Mobile events may arrive minutes late, so aggregating by processing time gives wrong answers. A watermark is the stream engine\'s moving assertion — "I believe I\'ve now seen all events up to time T" — which lets windows close and emit results while handling stragglers via allowed lateness or side outputs.', say:'"A letter\'s postmark date vs the day it lands in your mailbox — analytics must count by the postmark."'},
 {q:'What are tumbling, sliding, and session windows?', a:'Tumbling: fixed, non-overlapping buckets (every 5 min) — each event in exactly one window. Sliding: fixed length but overlapping (5-min window every 1 min) — for smooth moving metrics. Session: dynamic windows split by inactivity gaps — natural for user-visit analytics.', say:'"Tumbling = calendar days, sliding = \'last 24 hours\' at any moment, session = one sitting at the dinner table."'},
 {q:'What is the Lambda architecture, and why do people call Kappa its successor?', a:'Lambda ran two parallel paths — a batch layer for accurate history and a speed layer for real-time — merged at serving time. It works but doubles code and reconciliation pain. Kappa says: keep everything as a stream (with a replayable log like Kafka); to reprocess history, just replay the log through the same streaming code. Modern lakehouse streaming (Delta/Flink) mostly follows the Kappa spirit.', say:'"Lambda maintains two kitchens cooking the same dish; Kappa keeps one recipe and replays the ingredients."'}
],
oneLiner:'Batch moves bundles on a schedule; streaming moves drops through a pipe. The business SLA — not the technology hype — decides which one you plumb.',
pitfalls:['Answering "streaming is always better because it\'s real-time" — interviewers want cost/complexity tradeoffs.','Not knowing watermarks and late data — the most common streaming follow-up.']
},

/* ================= 06 Row vs Columnar ================= */
{
id:'formats', num:'06', track:'t2',
title:'File Formats: Row vs Columnar',
tagline:'Reading one student\'s full report card vs one subject\'s marks for the whole class.',
analogy:{label:'Real-world analogy · The School Register',
text:'A <strong>row store</strong> is a stack of report cards — one card per student with all subjects. Perfect to fetch <em>everything about one student</em>. A <strong>columnar store</strong> is the teacher\'s register with one page per subject listing every student\'s marks. To compute the class average in Maths you open <em>one page</em>, not 40 report cards. Analytics asks column-shaped questions, so warehouses store data column-first.'},
stage:`<svg viewBox="0 0 800 300" role="img" aria-label="Row versus columnar storage layout">
<rect width="800" height="300" fill="#FFFDF8"/>
<text x="190" y="45" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#B08D57" font-weight="700">ROW · report cards</text>
<g>
<rect x="80" y="70" width="220" height="30" rx="5" fill="#F0E2CE" stroke="#B08D57"/><text x="190" y="90" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#7A6230">id₁ name₁ city₁ amt₁</text>
<rect x="80" y="108" width="220" height="30" rx="5" fill="#F0E2CE" stroke="#B08D57"/><text x="190" y="128" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#7A6230">id₂ name₂ city₂ amt₂</text>
<rect x="80" y="146" width="220" height="30" rx="5" fill="#F0E2CE" stroke="#B08D57"/><text x="190" y="166" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#7A6230">id₃ name₃ city₃ amt₃</text>
</g>
<rect x="76" y="66" width="228" height="38" rx="7" fill="none" stroke="#0F6B5C" stroke-width="2.5" class="pulse"/>
<text x="190" y="205" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#5C5347">great for: fetch ONE record</text>
<text x="600" y="45" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#0F6B5C" font-weight="700">COLUMNAR · register</text>
<g>
<rect x="470" y="70" width="60" height="130" rx="5" fill="#E3EFEB" stroke="#0F6B5C"/><text x="500" y="140" text-anchor="middle" font-size="11" font-family="JetBrains Mono" fill="#0F6B5C" transform="rotate(-90 500 140)">id₁ id₂ id₃</text>
<rect x="540" y="70" width="60" height="130" rx="5" fill="#E3EFEB" stroke="#0F6B5C"/><text x="570" y="140" text-anchor="middle" font-size="10" font-family="JetBrains Mono" fill="#0F6B5C" transform="rotate(-90 570 140)">names…</text>
<rect x="610" y="70" width="60" height="130" rx="5" fill="#E3EFEB" stroke="#0F6B5C"/><text x="640" y="140" text-anchor="middle" font-size="10" font-family="JetBrains Mono" fill="#0F6B5C" transform="rotate(-90 640 140)">cities…</text>
<rect x="680" y="70" width="60" height="130" rx="5" fill="#FBF3DC" stroke="#C9A227" stroke-width="2.5"/><text x="710" y="140" text-anchor="middle" font-size="10" font-family="JetBrains Mono" fill="#A2831F" transform="rotate(-90 710 140)">amounts…</text>
</g>
<rect x="676" y="66" width="68" height="138" rx="7" fill="none" stroke="#C9A227" stroke-width="2.5" class="pulse"/>
<text x="605" y="230" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="#5C5347">SUM(amount): read ONE column, skip the rest</text>
</svg>`,
body:`<p><strong>Row formats</strong> (CSV, JSON, Avro) store complete records together — ideal for transactional access and streaming single events. <strong>Columnar formats</strong> (Parquet, ORC) store each column\'s values together — ideal for analytics, because a query touching 3 of 200 columns reads only those 3 from disk.</p>
<p>Columnar also compresses dramatically better: a column holds one data type with repeating patterns (think a country column that\'s 90% "IN"), enabling dictionary and run-length encoding. <strong>Parquet</strong> is the de facto analytics format and the file layer beneath Delta and Iceberg. <strong>Avro</strong> remains popular for Kafka messages because it\'s row-oriented, compact, and carries a schema that evolves well.</p>`,
concepts:[
 {t:'Column pruning', d:'Analytics queries select few columns; columnar files let engines read only those bytes. This is the #1 reason Parquet beats CSV by 10–100x.'},
 {t:'Predicate pushdown', d:'Parquet stores min/max stats per block, so WHERE date=\'2026-07-01\' can skip whole blocks without reading them.'},
 {t:'Compression synergy', d:'Same-type values side by side compress far better — dictionary, run-length, delta encoding. Smaller files = less IO = faster + cheaper.'},
 {t:'Right format, right job', d:'Avro/JSON for event transport and write-heavy streams; Parquet/ORC for analytical storage. Pipelines often receive Avro and land Parquet.'}
],
qa:[
 {q:'Why is Parquet preferred over CSV for analytics?', a:'Four compounding reasons: columnar layout enables column pruning (read only queried columns); embedded min/max statistics enable predicate pushdown (skip irrelevant blocks); type-aware encoding plus compression shrinks storage several-fold; and the schema travels with the file, unlike CSV\'s guesswork. Together this typically means 10–100x cheaper and faster scans.', say:'"CSV makes the engine read the whole school\'s report cards to average one subject; Parquet opens just the Maths page."'},
 {q:'Explain predicate pushdown and column pruning.', a:'Column pruning: only the columns referenced in the query are read from storage. Predicate pushdown: filters are applied at the storage layer using per-block min/max stats, so blocks that cannot match are skipped entirely. Both reduce IO before compute even starts, which is where analytical cost lives.', say:'"Pruning skips columns you didn\'t ask about; pushdown skips rows that can\'t possibly match — both before reading."'},
 {q:'When would you use Avro instead of Parquet?', a:'Avro is row-oriented, so writing one complete event is cheap and reading one complete message is natural — perfect for Kafka transport and write-intensive ingestion. It also has first-class schema evolution with a schema registry. The common pattern: Avro in motion, Parquet at rest.', say:'"Avro is the envelope for sending records; Parquet is the filing cabinet for analyzing them."'},
 {q:'What is the small files problem?', a:'Object stores and engines pay per-file overhead (metadata, open/close, scheduling). Streaming or over-partitioned jobs producing millions of KB-sized Parquet files can make queries slower than one big CSV. Fixes: compaction jobs (OPTIMIZE in Delta, rewrite in Iceberg), sizing files ~128MB–1GB, and buffering before writes.', say:'"A library of one-page books is slower than fewer thick volumes — compaction binds the pages together."'}
],
oneLiner:'Analytics asks column-shaped questions, so store data column-shaped: read less, compress more, pay less. That\'s the whole magic of Parquet.',
pitfalls:['Saying "Parquet is compressed CSV" — the layout and statistics, not just compression, drive the speedup.','Forgetting the small-files problem — a favorite senior-level follow-up.']
},

/* ================= 07 Partitioning ================= */
{
id:'partitioning', num:'07', track:'t2',
title:'Partitioning & Clustering',
tagline:'A multi-storey car park: floor by vehicle type, rows sorted by number plate.',
analogy:{label:'Real-world analogy · The Car Park',
text:'Imagine hunting for one car in a 10,000-car park with no signs — you\'d walk every floor (a full table scan). Now the park assigns <strong>floors by vehicle type</strong> (partitioning: go straight to Floor 3 for SUVs, skip the rest) and within each floor <strong>parks cars sorted by number plate</strong> (clustering: walk directly to the right row). The <strong>attendant\'s ledger</strong> mapping plate → exact slot is an index. Same cars — organization is what kills the search time.'},

<rect x="80" y="216" width="280" height="44" rx="8" fill="#EDEAE2" stroke="#C9C0AC"/><text x="220" y="243" text-anchor="middle" font-size="11.5" font-family="JetBrains Mono" fill="#8A7F6F">dt=2026-07-09 (skipped)</text>
