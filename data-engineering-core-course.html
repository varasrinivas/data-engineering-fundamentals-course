body:`<p>The design round tests whether you reason from a workload to an architecture — not whether you can name tools. Use a consistent method.</p>
<p><strong>1 · Clarify before architecting.</strong> Ask about data volume and growth, latency/freshness (which decides batch vs streaming), who the consumers are and how they\'ll query, the SLA, the budget, and failure tolerance. Anchor every later choice in these answers.</p>
<p><strong>2 · Sketch the reference flow.</strong> Sources → <strong>Ingest</strong> (CDC/Kafka for streams, batch pulls otherwise) → <strong>Store</strong> (lake/lakehouse, medallion layers) → <strong>Process</strong> (Spark/dbt to clean and model) → <strong>Serve</strong> (warehouse for BI, feature store for ML, API for apps). Then layer the <strong>cross-cutting</strong> concerns proactively: orchestration, idempotency, data quality checks, governance, cost controls, and monitoring — naming these unprompted signals seniority.</p>
<p><strong>3 · State tradeoffs, not absolutes.</strong> "Streaming gives seconds of latency but costs more and is harder to make correct; given the daily-dashboard requirement, I\'d start batch." Every choice is a tradeoff tied back to a requirement — and you\'ve already covered the pieces (storage, formats, partitioning, SCD, CDC, orchestration, idempotency, quality) in the earlier modules.</p>`,
concepts:[
 {t:'Requirements first, always', d:'The first ten minutes are questions: volume, latency, consumers, SLA, budget, failure. Jumping to tools before requirements is the single most common way candidates fail this round.'},
 {t:'The five-layer reference', d:'Ingest → Store → Process → Serve, with consumers at the end. A reusable skeleton you can adapt to any prompt (e-commerce analytics, payments ledger, ride-sharing).'},
 {t:'Cross-cutting concerns', d:'Orchestration, idempotency, data quality, governance, cost, monitoring. Mentioning these unprompted is what separates someone who has operated pipelines from someone who has only drawn them.'},
 {t:'Tradeoffs over absolutes', d:'No tool is "best" — each choice trades latency, cost, complexity, and correctness. Tie every decision back to a stated requirement and name what you\'re giving up.'}
],
qa:[
 {q:'How do you approach a "design a data pipeline" interview question?', a:'I resist drawing anything for the first few minutes and ask clarifying questions: expected data volume and growth, freshness/latency needs (which decides batch vs streaming), who consumes the output and how, the SLA, the budget, and failure tolerance. Then I sketch a reference flow — ingest, store, process, serve — choosing tools that fit those answers, and I proactively cover orchestration, idempotency, data quality, governance, cost, and monitoring. Throughout, I state tradeoffs rather than declaring a tool "best." The interviewer is evaluating my reasoning, so I think out loud and tie every decision to a requirement.', say:'"The first ten minutes are questions, not architecture — the architect asks about the family before drawing the house."'},
 {q:'Design an analytics pipeline for a growing e-commerce company.', a:'First I\'d clarify: order volume and growth, whether they need real-time inventory/fraud (streaming) or daily sales dashboards (batch), consumers (analysts, execs, ML), and budget. Assuming mostly daily analytics with some near-real-time inventory: ingest via log-based CDC from the orders database into Kafka, land raw into a lakehouse Bronze layer, transform to Silver (cleaned, conformed entities) and Gold (star-schema marts) with Spark/dbt, and serve Gold to a warehouse for BI plus a feature store for recommendations. Orchestrate with Airflow, make every job idempotent and partitioned by date, gate quality between medallion layers, model dimensions as SCD Type 2 for historical accuracy, and add cost controls and freshness monitoring. For the inventory need, a parallel streaming path with windowed aggregations.', say:'"Clarify the freshness need first — that single answer decides half the architecture."'},
 {q:'How do you design for scale and failure in a pipeline?', a:'For scale: partition data by the common filter (usually date), choose columnar formats, scale processing horizontally (Spark), decouple stages with a durable log (Kafka) so bursts are absorbed, and pre-aggregate hot query paths. For failure: make every job idempotent and parameterized by logical date so retries and backfills are safe, keep raw Bronze immutable so downstream layers can be rebuilt, add retries with backoff and dead-letter queues, gate data quality so bad data is quarantined not propagated, and monitor freshness and volume so failures page before consumers notice. The medallion + idempotency + observability combination is what makes the system resilient.', say:'"Idempotent jobs, an immutable raw layer, a durable buffer, and freshness alerts — resilience is designed in, not bolted on."'},
 {q:'When would you choose a batch versus streaming architecture in a design?', a:'I derive it from the freshness requirement and the cost of staleness. If decisions are made hourly or daily — most BI and reporting — batch is cheaper, simpler, and easier to make correct. If the value of data decays in seconds or minutes — fraud detection, live inventory, real-time personalization — streaming earns its extra cost and complexity. Often the answer is both: a batch backbone for analytics plus a targeted streaming path for the few real-time needs (a Kappa-style design with a replayable log), rather than forcing everything through one paradigm.', say:'"Let the cost of staleness decide — batch the backbone, stream only what genuinely can\'t wait."'}
],
oneLiner:'Pipeline design is architecture: ask about the family before drawing the house. Clarify volume, latency, consumers, SLA, budget, and failure first — then the tools almost choose themselves, and every earlier module becomes a building block.',
pitfalls:['Jumping straight to naming tools ("I\'d use Snowflake and Databricks") before clarifying requirements — the fastest way to fail a design round.','Buzzword bingo — namechecking ten tools you haven\'t used. One tool you can reason about deeply beats ten you can only name.']
}

body:`<p>Three related mechanisms sit under almost every database: how you <em>identify</em> a row, how you <em>find</em> it fast, and how you <em>place</em> it.</p>
<p><strong>Primary keys</strong> uniquely identify each row — they must be <em>unique</em> and <em>not null</em>. A <strong>natural key</strong> is a real-world attribute (email, PAN); a <strong>surrogate key</strong> is a meaningless system-generated value (auto-increment or UUID). A <strong>composite key</strong> combines columns; a <strong>foreign key</strong> references another table\'s primary key and is the basis of joins. In warehouses, surrogate keys win — stable, PII-free, immune to source changes. The gotcha: cloud warehouses (BigQuery, Snowflake, Redshift) <em>accept</em> primary-key declarations but <strong>don\'t enforce</strong> them — they\'re optimizer hints, so duplicates load silently and you must enforce uniqueness yourself.</p>
<p><strong>Indexes</strong> are separate sorted structures mapping a column value to row locations, turning a full scan into a direct lookup — at the cost of write overhead and storage. A <strong>B-tree</strong> (the default) handles equality <em>and</em> range queries; a <strong>hash index</strong> gives O(1) equality lookups but no ranges; a <strong>bitmap index</strong> suits low-cardinality columns (status, gender) common in analytics. A <strong>clustered</strong> index physically sorts the table by the key (one per table); a <strong>non-clustered</strong> index is a separate structure pointing back to rows.</p>
<p><strong>Hashing</strong> maps a key to a fixed-size bucket via a deterministic function. It powers <strong>hash partitioning / bucketing</strong> (spread rows evenly across nodes for parallelism and to fight skew), <strong>hash joins</strong> (build a hash table on the small side, probe with the large — O(n) instead of nested-loop O(n²)), <strong>consistent hashing</strong> (distribute data across nodes on a ring so adding or removing a node moves minimal data — how Cassandra and DynamoDB shard), and <strong>row hashing</strong> (fingerprint an entire row so a changed hash flags a changed record — used in SCD Type 2 and CDC).</p>`,
concepts:[
 {t:'Primary key = unique + not null', d:'A row\'s identity. Natural key (a real attribute) vs surrogate key (system-generated, preferred in warehouses). Foreign keys reference it to form relationships and joins.'},
 {t:'Warehouses don\'t enforce keys', d:'BigQuery/Snowflake/Redshift treat primary-key and unique declarations as optimizer hints, not constraints — duplicates load silently. You enforce uniqueness with dedup, MERGE-on-key, and tests.'},
 {t:'Index types & cost', d:'B-tree = equality + range (default); hash = equality only, O(1); bitmap = low-cardinality/analytics. Clustered = table sorted by key (one per table) vs non-clustered = separate pointer structure. Faster reads, slower writes.'},
 {t:'Hashing is everywhere', d:'Hash partitioning/bucketing (even distribution), hash joins (build/probe), consistent hashing (shard across nodes with minimal movement), and row-hash checksums (change detection for SCD/CDC).'}
],
qa:[
 {q:'What is a primary key, and when do you use a surrogate key over a natural key?', a:'A primary key uniquely identifies each row and must be unique and non-null — it\'s the entity\'s identity, and it\'s what foreign keys reference to form relationships. A natural key is a meaningful real-world value (email, PAN number); a surrogate key is a system-generated meaningless value (auto-increment or UUID). I prefer surrogates in the warehouse because they stay stable when source values change, carry no PII, avoid collisions when merging multiple sources, and are required for SCD Type 2, where one business entity maps to many versioned rows.', say:'"A natural key is your name; a surrogate key is your passport number — stable, unique, and yours alone."'},
 {q:'Do cloud data warehouses enforce primary key and unique constraints?', a:'Generally no. BigQuery, Snowflake, and Redshift let you declare primary keys and unique constraints, but they\'re informational — used by the optimizer, not enforced — so you can insert duplicate keys without any error. That means the data engineer owns uniqueness: deduplicate with ROW_NUMBER() partitioned by the key, upsert with MERGE keyed on the business key, and add data-quality tests (like dbt\'s unique test) that fail the pipeline if duplicates appear. Assuming the declaration protects you is a common and costly mistake.', say:'"In a warehouse, a primary key is a promise, not a guarantee — you have to keep it yourself."'},
 {q:'How does an index speed up a query, what does it cost, and what types do you know?', a:'An index is a separate sorted structure mapping column values to row locations, so the engine jumps straight to matching rows instead of scanning the whole table — like a book\'s back index. The cost is write amplification (every insert and update maintains it) plus storage, so over-indexing hurts write-heavy tables. Types: B-tree (the default — equality, range, and sorted scans); hash index (O(1) equality but no ranges); bitmap index (efficient for low-cardinality columns, common in analytics); and clustered (the table is physically ordered by the key, one per table) versus non-clustered (a separate structure pointing to rows). Columnar warehouses usually skip row-level indexes entirely and rely on partition pruning, clustering, and min-max zone maps instead.', say:'"An index is the back-of-book index — a sorted shortcut that trades slower writes for much faster reads."'},
 {q:'Where is hashing used in data engineering?', a:'In four big places. Hash partitioning or bucketing distributes rows evenly across buckets or nodes by hashing the key, enabling parallelism and fighting skew (Spark bucketing, Redshift key distribution, Kafka partitioning by key). Hash joins build an in-memory hash table on the smaller table keyed by the join column and probe it with the larger table — linear instead of quadratic. Consistent hashing places data on a ring so adding or removing a node reshuffles only a small fraction of keys — how Cassandra, DynamoDB, and distributed caches shard. And row hashing computes a single fingerprint over all of a row\'s columns, so a differing hash instantly flags a changed record — which is how SCD Type 2 and CDC detect changes without comparing every column.', say:'"Hashing turns a key into an address — for spreading data evenly, joining fast, sharding across nodes, and spotting changed rows."'}
],
oneLiner:'A primary key answers "which row?", an index answers "where is it?" with a sorted shortcut, and hashing answers "where is it?" by computing the address outright — identity and fast lookup, the machinery under every database.',
pitfalls:['Assuming a declared primary key in a cloud warehouse is enforced — it isn\'t; duplicates load silently, so you must dedupe and test for them yourself.','Confusing a hash index (equality lookups only) with a B-tree (equality and range) — and reaching for a row index to speed up a columnar warehouse, which uses pruning and clustering instead.']
}
);

text:'A single phone book for an entire city becomes impossible to hold or search. So it\'s split into <strong>volumes</strong> by surname — A–H, I–P, Q–Z — and the first letter tells you which volume to open. That is <strong>sharding</strong>: each volume (shard) holds a disjoint slice of the data, and the <strong>shard key</strong> (the surname) routes you to the right one. But one volume being lost or in use would block everyone, so the city prints <strong>several copies of each volume</strong> and keeps them in different buildings — that is <strong>replication</strong>. Sharding buys scale (no single book holds it all); replication buys survival and lets many people read at once.'},

body:`<p>Vertical scaling — a bigger machine — hits a hard ceiling (see the Big Data module). Horizontal scaling across many nodes is the answer, and it comes in two complementary forms.</p>
<p><strong>Sharding</strong> splits the dataset so each node (shard) holds a <em>disjoint subset</em>. A <strong>shard key</strong> decides where each row lives. Strategies: <strong>range-based</strong> (A–H, I–P… — great for range scans but prone to hotspots), <strong>hash-based</strong> (hash the key for even distribution — kills hotspots but scatters range queries across all shards), <strong>directory</strong> (a lookup table maps keys to shards — flexible but a potential bottleneck), and <strong>geo</strong> (by region). Consistent hashing (from the Keys module) is how you shard so adding or removing a node moves minimal data.</p>
<p><strong>Replication</strong> keeps <em>copies</em> of data on multiple nodes for availability, durability, and read scaling. Models: <strong>leader-follower</strong> (one leader takes writes, followers replicate and serve reads), <strong>multi-leader</strong> (several write nodes for multi-region, needing conflict resolution), and <strong>leaderless</strong> (any node accepts writes, quorum reads — Dynamo-style). Replication is <strong>synchronous</strong> (wait for replicas — consistent but slower) or <strong>asynchronous</strong> (don\'t wait — fast but risks stale reads and losing recent writes on failover). That sync-vs-async choice is exactly the CAP consistency-versus-availability tradeoff in practice. Real systems do <em>both</em>: shard for scale, replicate each shard for resilience.</p>`,
concepts:[
 {t:'Sharding = split, Replication = copy', d:'Sharding scales writes and storage (each node holds a subset); replication scales reads and availability (each node holds a copy). Production systems use both together.'},
 {t:'Shard key & strategy', d:'The shard key decides placement. Range (range scans, but hotspots), hash (even, but no range scans), directory (flexible, but a bottleneck), geo. Choose it to spread load and keep related data together.'},
 {t:'Partitioning vs sharding', d:'Partitioning divides a table into segments (can live on one machine); sharding distributes those partitions across separate machines to scale out. Sharding is horizontal partitioning across nodes.'},
 {t:'Replication models & sync/async', d:'Leader-follower, multi-leader, leaderless. Sync (consistent, slower, blocks if a replica is down) vs async (fast, risks stale/lost writes). This is where CAP\'s C-vs-A tradeoff actually lives.'}
],
qa:[
 {q:'What is sharding, and how do you choose a shard key?', a:'Sharding horizontally splits a dataset across multiple database nodes so each shard holds a disjoint subset, letting you scale writes and storage beyond one machine. The shard key determines which shard a row lands on, so choosing it well is critical: it should spread data and load evenly to avoid hotspots, keep frequently-joined data co-located on the same shard to avoid expensive cross-shard queries, and match the dominant access pattern. Hash-based sharding on a high-cardinality key gives even distribution; range-based helps range scans but risks hotspots; a poor key — low cardinality or one hot value — recreates the very bottleneck you sharded to escape.', say:'"A shard key is a bet on where every row lives — pick one that spreads load evenly and keeps related rows together."'},
 {q:'What is the difference between partitioning and sharding?', a:'They\'re the same idea at different scopes. Partitioning divides a table into segments, which can live within a single database or node — like partitioning a fact table by date for pruning. Sharding distributes those partitions across separate, independent database instances or servers to scale horizontally, each shard typically on its own machine with its own CPU, memory, and disk. So sharding is horizontal partitioning taken across machines: partitioning is logical division, sharding is physical distribution for scale-out. Vendors vary in terminology, but that\'s the distinction interviewers are looking for.', say:'"Partitioning splits the table; sharding spreads those splits across separate machines."'},
 {q:'Explain replication, and leader-follower with synchronous vs asynchronous.', a:'Replication keeps copies of the same data on multiple nodes for availability (survive a node failure), durability, and read scaling (serve reads from replicas). The common model is leader-follower: one leader accepts writes and streams changes to followers, which serve reads, and if the leader fails a follower is promoted. Replication can be synchronous — the leader waits for replicas to confirm before acknowledging a write, giving strong consistency but higher latency and stalling if a replica is down — or asynchronous — the leader acknowledges immediately and replicates in the background, which is fast and available but risks serving stale reads and losing the last few writes if the leader dies before they propagate. That sync-versus-async choice is the CAP consistency-versus-availability tradeoff made concrete.', say:'"Sync replication waits for the copies and stays correct; async doesn\'t wait and stays fast — that\'s CAP in one setting."'},
 {q:'How do sharding and replication work together, and what are the main pitfalls?', a:'Production distributed databases do both: shard the data for scale and replicate each shard for resilience, so every subset lives on multiple nodes. The main pitfalls are hotspots — the celebrity problem, where one shard-key value like a viral user overwhelms its shard (mitigate with a better key, hashing, or splitting hot keys); rebalancing — adding or removing nodes should move minimal data, which is why consistent hashing matters; and cross-shard operations — joins, aggregations, and multi-shard transactions are slow and complex, so you design the shard key to keep related data on one shard. Getting the shard key wrong is the expensive mistake, because re-sharding a live system is painful.', say:'"Shard for scale, replicate for safety — and choose the key so a celebrity user doesn\'t melt one node and your joins don\'t span the whole cluster."'}
],
oneLiner:'Sharding splits the data across machines so each holds a slice; replication copies each slice so none is a single point of failure. One buys scale, the other buys survival — and real systems need both.',
pitfalls:['Confusing partitioning with sharding — partitioning can live on one machine; sharding distributes across separate machines for horizontal scale.','Ignoring the hotspot/celebrity problem or picking a low-cardinality shard key — re-sharding a live system to fix a bad key is one of the most painful operations in data engineering.']
},

tagline:'In the cloud the meter is always running — a fast query is a cheap query.',
analogy:{label:'Real-world analogy · The Meter Is Running',
text:'In the cloud, the meter never stops. You pay by the <strong>byte scanned</strong> and the <strong>second of compute</strong>, so a slow query isn\'t just slow — it\'s <em>expensive</em>, and a fast query is a cheap one. The way to a cheap trip is a short trip: <strong>read fewer bytes</strong> (don\'t drive down every aisle — prune partitions and columns), <strong>take a direct route</strong> (fewer joins and shuffles), <strong>don\'t carry dead weight</strong> (compress, aggregate early), and <strong>don\'t leave the engine idling</strong> (auto-suspend). Performance and cost are the same dial — turn one and the other moves with it.'},

body:`<p>In the cloud, <strong>performance and cost are the same dial</strong>: you\'re billed per byte scanned and per second of compute, so making a query fast usually makes it cheap. The unifying principle is simple — <strong>do less work: read less, move less, compute less.</strong></p>
<p><strong>Read less (I/O — the biggest lever).</strong> Most cost is bytes scanned. Use columnar formats plus compression, partition pruning, column pruning, predicate pushdown, and clustering/Z-order so filters skip data. <span class="mono">SELECT *</span> and unpartitioned scans are the classic waste. <strong>Move less (network/shuffle).</strong> Minimize shuffles, broadcast small tables in joins, and filter and aggregate <em>before</em> joining — data movement across the network is the slowest, costliest step. <strong>Compute less (CPU).</strong> Pre-aggregate into Gold marts or materialized views so dashboards don\'t recompute the same thing, process incrementally instead of full reloads, cache genuinely reused data, and push work down to the engine.</p>
<p><strong>The cost dimension (FinOps).</strong> Warehouses charge for scan (BigQuery) or compute-time (Snowflake). Levers: partition and cluster to cut bytes scanned, auto-suspend idle warehouses, right-size compute, prefer incremental over full reloads, use approximate functions where exact isn\'t needed, and monitor per-query cost. A slow pipeline is a leaking money tap. <strong>The method:</strong> measure first (read the query plan, Spark UI, or cost metrics), find the biggest waste, apply the smallest effective lever, and verify — never guess.</p>`,
concepts:[
 {t:'Performance = cost in the cloud', d:'Billed per byte scanned and per compute-second, so fast and cheap are the same goal. A query that scans 5 TB instead of 50 GB is 100× slower and 100× more expensive at once.'},
 {t:'Read less · move less · compute less', d:'Read less (prune partitions/columns, columnar + compression, pushdown); move less (minimize shuffles, broadcast joins, filter before joining); compute less (pre-aggregate, incremental, cache).'},
 {t:'FinOps levers', d:'Partition/cluster to cut scan, auto-suspend idle compute, right-size clusters, incremental over full reloads, approximate functions, and per-query cost monitoring.'},
 {t:'Measure, then fix', d:'Read the query plan / Spark UI / cost metrics first; find the biggest waste (scan, shuffle, skew, small files, recompute); apply the smallest effective lever; verify. Optimizing without measuring is guessing.'}
],
qa:[
 {q:'How do you approach optimizing a slow, expensive pipeline?', a:'I measure before touching anything — read the query plan (BigQuery execution graph, Snowflake profile) or the Spark UI to see where time and bytes actually go. Then I attack the biggest waste in order of leverage: read less (is it scanning full tables? add partition and cluster filters, prune columns, drop SELECT *), move less (is there a huge shuffle? broadcast the small side, filter before joining), compute less (is a dashboard recomputing the same aggregate? materialize a Gold table or incremental model). I apply the smallest effective change and re-measure to confirm it helped, rather than changing many things blindly. In the cloud this usually cuts cost and latency together.', say:'"Measure first, then read less, move less, compute less — and verify each change against the metric."'},
 {q:'Why are performance and cost the same problem in cloud data platforms?', a:'Because cloud pricing is usage-based: BigQuery charges by bytes scanned, Snowflake by warehouse compute-time, and Spark clusters by node-hours. So the work a query does is literally the bill. A query that scans a full 5 TB table instead of one 50 GB partition is a hundred times slower and a hundred times more expensive simultaneously. That\'s why the core levers — partition pruning, columnar formats, minimizing shuffles, pre-aggregation — improve latency and cost at the same time, and why "make it faster" and "make it cheaper" are usually the same task.', say:'"In the cloud the meter is always running — a fast query is a cheap query, because you pay for the work."'},
 {q:'What are the biggest levers to reduce bytes scanned and query cost?', a:'Reading less data is the highest-leverage optimization. Store data in a columnar, compressed format like Parquet so only needed columns are read; partition on the common filter column (usually date) so the engine prunes irrelevant partitions; cluster or Z-order on high-cardinality filter columns so blocks are skipped via min-max statistics; and write queries that filter on the partition column directly — no functions wrapping it, which defeats pruning — and select only the columns you need instead of SELECT *. For repeated dashboard queries, pre-aggregating into a smaller Gold table means each run scans kilobytes instead of terabytes.', say:'"Prune partitions, prune columns, compress, and pre-aggregate — every byte you don\'t scan is latency and money saved."'},
 {q:'What is a materialized view or pre-aggregation, and when do you use it?', a:'A materialized view stores the precomputed result of a query — often an aggregation — so consumers read the small answer instead of recomputing over raw data every time. I use it, or an equivalent incrementally-built Gold summary table, when the same expensive aggregation is queried repeatedly, which is exactly how BI dashboards behave: dozens of users hitting the same "revenue by region by day" shape. It trades a little storage and refresh cost for massive read savings. The tradeoff is freshness — the view lags until refreshed — and maintenance, so it fits stable, frequently-read aggregates rather than ad-hoc exploration.', say:'"Compute the expensive answer once and let everyone read it — precompute what\'s asked repeatedly instead of recomputing per query."'}
],
oneLiner:'In the cloud the meter is always running, so fast and cheap are the same dial: read less, move less, compute less — measure where the work is, cut the biggest waste, and verify.',
pitfalls:['Optimizing without measuring — guessing at the bottleneck instead of reading the query plan or Spark UI wastes effort on the wrong thing.','Talking only about speed and forgetting cost — in the cloud, bytes scanned and compute-seconds are the bill, so "fast" and "cheap" are the same goal.']
}

body:`<p>At enterprise scale — hundreds or thousands of source tables — writing one bespoke pipeline per source is unsustainable: copy-paste sprawl, inconsistent logic, and every new source becomes a development project. The metadata-driven pattern fixes this by separating the <strong>WHAT</strong> (configuration) from the <strong>HOW</strong> (a generic execution engine).</p>
<p>A <strong>control (metadata) table</strong> — or config files — holds per-entity parameters: source system and connection, source object, target table, load type (full or incremental), the watermark column and its last-loaded value, primary/business keys, SCD type, transformation and data-quality rules, schedule, and an active flag. A single <strong>generic pipeline</strong> reads this metadata and dynamically does the work for any registered entity — looping over entities and parameterizing extract, load, and transform. Onboarding a new source becomes an <em>insert</em>; the same engine picks it up on the next run, inheriting the platform\'s consistent quality, lineage, and error handling for free. Airflow dynamic DAG generation, dbt with vars/configs, and framework-driven ingestion (ADF/Databricks metadata-driven copy) all embody this.</p>
<p><strong>Two senses of "metadata" — don\'t conflate them.</strong> <em>Passive / descriptive</em> metadata is the <strong>catalog</strong>: what data exists, schemas, owners, lineage, meaning — for humans to discover and govern data (that\'s the Governance module). <em>Active / control</em> metadata <strong>drives execution</strong>: the config that tells pipelines what to do and how. Metadata-driven pipelines use the active kind. The modern "active metadata" trend connects the two — catalogs that don\'t just describe data but feed configuration back into orchestration, quality, and access.</p>`,
concepts:[
 {t:'Separate WHAT from HOW', d:'Config/metadata (the what: source, target, load type, keys, SCD, watermark) vs a generic engine (the how). You change behavior by editing data, not rewriting code.'},
 {t:'The control table', d:'A central table/config holding per-entity parameters — connection, object, load type, watermark, keys, SCD type, DQ rules, active flag. The single source of truth for what runs, and self-documenting.'},
 {t:'Onboard by config, not code', d:'A new source is an inserted row, not a new pipeline. Consistent logic, centralized enable/disable and scheduling, and DRY — versus a drawer of brittle bespoke scripts.'},
 {t:'Two kinds of metadata', d:'Passive/descriptive = the catalog (discovery, lineage, governance). Active/control = drives pipeline execution. Metadata-driven pipelines use the active kind; "active metadata" connects them.'}
],
qa:[
 {q:'What is a metadata-driven pipeline, and why use one?', a:'A metadata-driven pipeline separates configuration from execution: instead of hand-coding a separate pipeline for each source table, you build one generic, parameterized engine that reads a control table describing each entity — source, target, load type, keys, watermark, SCD type, transformation and quality rules — and dynamically processes any registered entity. You use it because at enterprise scale, hundreds or thousands of tables make bespoke pipelines unmaintainable: this design lets you onboard a new source by inserting a row rather than writing and testing new code, enforces consistent logic and governance across every pipeline, and centralizes control — enable/disable, change load type or schedule — in data instead of scattered scripts.', say:'"One config-driven engine instead of a drawer full of brittle scripts — onboard a source by adding a row, not writing a pipeline."'},
 {q:'What goes in a control / metadata table?', a:'The per-entity parameters the generic engine needs: the source system and connection, the source object, the target table, the load type (full or incremental), the incremental/watermark column and its last-loaded value, the primary or business keys, the SCD type for dimensions, transformation and data-quality rules, the schedule, and an active flag. This table becomes the single source of truth for what the platform ingests and how — it drives the pipelines and simultaneously documents them, so auditing what runs is a query, not a code review.', say:'"The control table is the recipe and the documentation — what to load, how, and where, for every source."'},
 {q:'How does a metadata-driven approach handle incremental loads and new sources?', a:'For incremental loads, the control table stores a watermark per entity — the last-loaded timestamp or ID. The generic pipeline reads it, pulls only rows newer than the watermark, applies the load (MERGE or partition overwrite), and advances the watermark — all idempotently, so reruns and backfills are safe. For a new source, you don\'t write code: you insert a metadata row describing it — connection, object, load type, keys, SCD type — and the same engine picks it up next run. That\'s the payoff: adding capacity is a data operation, and every source automatically inherits the platform\'s consistent quality, lineage, and error handling.', say:'"The watermark lives in metadata, the engine reads and advances it — and a new source is a new row, not a new project."'},
 {q:'What is the difference between a data catalog and metadata-driven pipelines?', a:'Both center on metadata but serve different purposes. A data catalog holds descriptive (passive) metadata — what data exists, its schema, owner, meaning, quality, and lineage — for discovery and governance, so people can find and trust data. Metadata-driven pipelines use control (active) metadata — configuration that tells the execution engine what to load and how. One is for humans discovering data; the other is for machines driving pipelines. The modern "active metadata" trend connects them: catalogs that don\'t just describe data but feed configuration back into orchestration, quality, and access — closing the loop between knowing about data and acting on it.', say:'"A catalog is metadata humans read to find data; a metadata-driven pipeline is metadata machines read to move data — active metadata is where they meet."'}
],
oneLiner:'Don\'t build five hundred pipelines — build one engine and five hundred rows of config. A metadata-driven approach turns onboarding a source from a coding project into a data entry, and makes the metadata itself the documentation.',
pitfalls:['Conflating the two senses of metadata — a data catalog (descriptive metadata for discovery/governance) is not the same as a metadata-driven pipeline (control metadata that drives execution).','Over-engineering a metadata framework for a handful of tables — the pattern pays off at scale (dozens to thousands of sources); for three pipelines it\'s premature complexity.']
}

const done = new Set();          // in-memory progress (resets on reload)
let current = 'home';

const $ = sel => document.querySelector(sel);
const sidebar = $('#sidebar'), content = $('#content');

// theme is in-memory only (defaults to the OS preference), matching the no-persistence design
const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
const setTheme = t => document.documentElement.setAttribute('data-theme', t);
function toggleTheme(){ setTheme(isDark() ? 'light' : 'dark'); renderSidebar(); }
// Explicit pedagogical order — numbering follows this, not array insertion order
const ORDER = ['why-de','big-data','evolution','oltp-olap','nosql-cap','sharding','etl-elt','dim-modeling','scd','lake-wh','medallion','formats','partitioning','keys-index-hash','spark','sql-de','performance','batch-stream','kafka','cdc','orchestration','idempotency','quality','governance','metadata-driven','system-design'];
const orderedMods = () => ORDER.map(id => MODS.find(m=>m.id===id)).filter(Boolean);
const numOf = m => String(orderedMods().indexOf(m)+1).padStart(2,'0');
const modsInTrack = tid => orderedMods().filter(m=>m.track===tid);

function renderSidebar(){
  let h = '<div class="brand">Data Engineering <span class="tealtx">Core</span></div>';
  h += '<div class="brand-sub">'+MODS.length+' concepts · foundations-first · interview-ready</div>';
  h += '<div class="progress-shell"><div class="progress-fill" id="pfill"></div></div>';
  h += '<div class="progress-label" id="plabel"></div>';
  h += '<button class="theme-toggle" data-theme-toggle>'+(isDark()?'☀  Light mode':'☾  Dark mode')+'</button>';
  h += '<button class="navitem'+(current==='home'?' active':'')+'" data-go="home"><span class="navnum">⌂</span><span>Course home</span></button>';
  h += '<button class="navitem mock-nav'+(current==='mock'?' active':'')+'" data-go="mock"><span class="navnum">◎</span><span>Mock Interview</span></button>';
  TRACKS.forEach(t=>{
    h += '<div class="tracklbl">'+t.name+'</div>';
    modsInTrack(t.id).forEach(m=>{
      h += '<button class="navitem'+(current===m.id?' active':'')+(done.has(m.id)?' done':'')+'" data-go="'+m.id+'"><span class="navnum">'+numOf(m)+'</span><span>'+m.title+'</span></button>';
    });
  });
  sidebar.innerHTML = h;
  const pct = Math.round(done.size/MODS.length*100);
  $('#pfill').style.width = pct+'%';
  $('#plabel').textContent = done.size+' / '+MODS.length+' modules complete ('+pct+'%)';
}

function esc(s){return s}

function renderHome(){
  let h = '<div class="eyebrow">A Free Course · Learn Once, Answer Anywhere</div>';
  h += '<h1>Data Engineering Core</h1>';
  h += '<p class="tagline">The twenty-six concepts behind almost every data engineering interview question — each taught through a real-world analogy, an animated diagram, and the exact answers interviewers want to hear.</p>';
  h += '<div class="hero-medal"><span class="medal" style="background:#B08D57"></span><span class="medal" style="background:#9BA3AD"></span><span class="medal" style="background:#C9A227"></span></div>';
  h += '<div class="analogy-box"><div class="albl">How to use this course</div>For each module: read the <strong>analogy</strong> until the mental picture clicks, study the <strong>animated diagram</strong>, then open every <strong>interview Q&amp;A</strong> and practice saying the answers out loud. Finish with the <strong>one-liner</strong> — it\'s your opening sentence in the interview. Mark the module done and move on.</div>';
  h += '<button class="scope-card" data-go="mock" style="width:100%;margin:16px 0 0"><div><h3>◎ Mock Interview Mode</h3><p>Rapid-fire questions drawn from all 26 topics. Reveal the model answer, self-score, and see exactly where you\'re interview-ready.</p></div><span class="go">Start round →</span></button>';
  h += '<div class="home-grid">';
  orderedMods().forEach(m=>{
    h += '<div class="home-card" data-go="'+m.id+'"><div class="hcn">MODULE '+numOf(m)+(done.has(m.id)?' · ✓ DONE':'')+'</div><h3>'+m.title+'</h3><p>'+m.tagline+'</p></div>';
  });
  h += '</div>';
  content.innerHTML = h;
}

function renderModule(m){
  const OM = orderedMods(); const idx = OM.indexOf(m);
  let h = '<div class="eyebrow">Module '+numOf(m)+' of '+MODS.length+' · '+TRACKS.find(t=>t.id===m.track).name.split('·')[1].trim()+'</div>';
  h += '<h1>'+m.title+'</h1>';
  h += '<p class="tagline">'+m.tagline+'</p>';
  h += '<div class="analogy-box"><div class="albl">'+m.analogy.label+'</div>'+m.analogy.text+'</div>';
  h += '<div class="stage">'+m.stage+'<div class="stage-cap">FIG '+numOf(m)+' · animated — motion shows how data actually moves</div></div>';
  h += '<h2><span class="k">The concept</span>What it really means</h2>'+m.body;
  h += '<h2><span class="k">Mental anchors</span>Four things to remember</h2><div class="cgrid">';
  m.concepts.forEach((c,i)=>{ h += '<div class="ccard"><h4><span class="cn">0'+(i+1)+'</span>'+c.t+'</h4><p>'+c.d+'</p></div>'; });
  h += '</div>';
  h += '<h2><span class="k">Interview room</span>Questions you will actually get</h2>';
  m.qa.forEach((q,i)=>{
    h += '<div class="qa" id="qa-'+i+'"><button class="qa-q" data-qa="'+i+'"><span class="qm">Q'+(i+1)+'</span><span>'+q.q+'</span><span class="chev">▸</span></button>';
    h += '<div class="qa-a"><p>'+q.a+'</p><div class="say"><b>Say it like this</b>'+q.say+'</div></div></div>';
  });
  h += '<div class="oneliner"><div class="olbl">The one-liner · open your answer with this</div><p>'+m.oneLiner+'</p></div>';
  h += '<h2><span class="k">Danger zone</span>Answers that lose points</h2>';
  m.pitfalls.forEach(p=>{ h += '<div class="pit"><span class="pi">AVOID</span><span>'+p+'</span></div>'; });
  h += '<div class="footnav">';
  h += idx>0 ? '<button class="btn" data-go="'+OM[idx-1].id+'">← '+OM[idx-1].title+'</button>' : '<button class="btn" data-go="home">← Course home</button>';
  h += '<button class="btn done-toggle'+(done.has(m.id)?' marked':'')+'" data-done="'+m.id+'">'+(done.has(m.id)?'✓ Completed':'Mark complete')+'</button>';
  h += idx<MODS.length-1 ? '<button class="btn primary" data-go="'+OM[idx+1].id+'">'+OM[idx+1].title+' →</button>' : '<button class="btn primary" data-go="home">Finish → Home</button>';
  h += '</div>';
  content.innerHTML = h;
  window.scrollTo({top:0,behavior:'instant'});
}

function go(id){
  current = id;
  if(id==='home') renderHome();
  else if(id==='mock'){ mock=null; renderMock(); }
  else renderModule(MODS.find(m=>m.id===id));
  renderSidebar();
  sidebar.classList.remove('open');
}

document.addEventListener('click', e=>{
  const themeEl = e.target.closest('[data-theme-toggle]');
  if(themeEl){ toggleTheme(); return; }
  const goEl = e.target.closest('[data-go]');
  if(goEl){ go(goEl.dataset.go); return; }
  const doneEl = e.target.closest('[data-done]');
  if(doneEl){
    const id = doneEl.dataset.done;
    done.has(id) ? done.delete(id) : done.add(id);
    renderModule(MODS.find(m=>m.id===id));
    renderSidebar();
    return;
  }
  const qaBtn = e.target.closest('[data-qa]');
  if(qaBtn){ qaBtn.parentElement.classList.toggle('open'); return; }
  if(e.target.id==='menubtn'){ sidebar.classList.toggle('open'); }
});

setTheme(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
go('home');
/* ================= MOCK INTERVIEW ENGINE ================= */
// Build the question bank from every module's embedded Q&A (88 questions)
const QBANK = [];
orderedMods().forEach(m=>{
  (m.qa||[]).forEach(qa=>{
    QBANK.push({id:m.id, mod:m.title, num:numOf(m), track:m.track,
      trackName:((TRACKS.find(t=>t.id===m.track)||{}).name||'').split('·').slice(-1)[0].trim(),
      q:qa.q, a:qa.a, say:qa.say});
  });
});

let mock = null; // {questions, idx, results[], revealed, mode, trackId, label}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
// stratified: sample across tracks so a short round tests breadth
function quickRound(n){
  const byTrack={};
  QBANK.forEach(q=>{ (byTrack[q.track]=byTrack[q.track]||[]).push(q); });
  Object.values(byTrack).forEach(shuffle);
  const tids=Object.keys(byTrack), picked=[]; let i=0;
  while(picked.length<n && tids.some(t=>byTrack[t].length)){
    const t=tids[i%tids.length];
    if(byTrack[t].length) picked.push(byTrack[t].pop());
    i++;
  }
  return shuffle(picked);
}

function startMock(mode, trackId){
  let qs, label;
  if(mode==='quick'){ qs=quickRound(10); label='Quick Round · 10 mixed questions'; }
  else if(mode==='full'){ qs=shuffle(QBANK.slice()); label='Full Gauntlet · all '+QBANK.length+' questions'; }
  else { qs=shuffle(QBANK.filter(q=>q.track===trackId)); const tn=((TRACKS.find(t=>t.id===trackId)||{}).name||'').split('·').slice(-1)[0].trim(); label='Track Focus · '+tn+' ('+qs.length+' questions)'; }
  mock={questions:qs, idx:0, results:[], revealed:false, mode:mode, trackId:trackId, label:label};
  renderMockQuestion();
}

function renderMock(){
  current='mock';
  let h='<div class="eyebrow">◎ Exam Mode · Test Yourself</div>';
  h+='<h1>Mock Interview</h1>';
  h+='<p class="tagline">Rapid-fire questions from all 26 modules. Answer out loud, reveal the model answer, score yourself honestly — then see where you\'re ready and where to review.</p>';
  h+='<div class="mock-scope">';
  h+='<button class="scope-card" data-mock-start="quick"><div><h3>Quick Round</h3><p>10 questions sampled across every track — a fast breadth check before an interview.</p></div><span class="go">Start →</span></button>';
  h+='<button class="scope-card" data-mock-start="full"><div><h3>Full Gauntlet</h3><p>All '+QBANK.length+' questions, shuffled. The complete self-assessment across the whole course.</p></div><span class="go">Start →</span></button>';
  h+='</div>';
  h+='<div class="tracklbl" style="margin-top:22px">Or focus one track</div>';
  h+='<div class="track-chips">';
  TRACKS.forEach(t=>{
    const cnt=QBANK.filter(q=>q.track===t.id).length;
    const short=t.name.split('·').slice(-1)[0].trim();
    h+='<button class="tchip" data-mock-track="'+t.id+'">'+short+' · '+cnt+'</button>';
  });
  h+='</div>';
  content.innerHTML=h;
  window.scrollTo({top:0,behavior:'instant'});
}

function renderMockQuestion(){
  const q=mock.questions[mock.idx];
  const n=mock.questions.length, pos=mock.idx+1;
  const pct=Math.round((mock.idx)/n*100);
  let h='<div class="eyebrow">◎ '+mock.label+'</div>';
  h+='<div class="mock-progress-shell"><div class="mock-progress-fill" style="width:'+pct+'%"></div></div>';
  h+='<div class="mock-meta">Question '+pos+' of '+n+'</div>';
  h+='<div class="qcard">';
  h+='<div class="qsrc">MODULE '+q.num+' · '+q.mod+' · '+q.trackName+'</div>';
  h+='<div class="qtext">'+q.q+'</div>';
  if(!mock.revealed){
    h+='<button class="reveal-btn" data-mock-reveal>Reveal model answer</button>';
  } else {
    h+='<div class="mock-answer"><p>'+q.a+'</p><div class="say"><b>Say it like this</b>'+q.say+'</div>';
    h+='<div class="rate-prompt">How did you do? Score yourself honestly.</div>';
    h+='<div class="rate-row">';
    h+='<button class="rate-btn n" data-mock-rate="nailed">✓ Nailed it</button>';
    h+='<button class="rate-btn p" data-mock-rate="partial">~ Partial</button>';
    h+='<button class="rate-btn m" data-mock-rate="missed">✗ Missed</button>';
    h+='</div></div>';
  }
  h+='</div>';
  h+='<button class="mock-exit" data-mock-exit>End round early</button>';
  content.innerHTML=h;
  window.scrollTo({top:0,behavior:'instant'});
}

function rateAndAdvance(rating){
  const q=mock.questions[mock.idx];
  mock.results.push({id:q.id, mod:q.mod, num:q.num, track:q.track, trackName:q.trackName, rating:rating});
  mock.revealed=false;
  mock.idx++;
  if(mock.idx>=mock.questions.length) renderMockResults();
  else renderMockQuestion();
}

function renderMockResults(){
  const r=mock.results, n=r.length;
  const nailed=r.filter(x=>x.rating==='nailed').length;
  const partial=r.filter(x=>x.rating==='partial').length;
  const missed=r.filter(x=>x.rating==='missed').length;
  const score=nailed+0.5*partial;
  const pct=n? Math.round(score/n*100):0;
  let vClass,vLbl,vHead,vMsg;
  if(pct>=85){ vClass='ready'; vLbl='Verdict'; vHead='Interview-ready'; vMsg='You can explain these concepts clearly and reach for the right framing. Keep the weak spots sharp and walk in confident.'; }
  else if(pct>=60){ vClass='almost'; vLbl='Verdict'; vHead='Almost there'; vMsg='The foundation is solid. Tighten the partial and missed topics below until the answers come without hesitation.'; }
  else { vClass='practice'; vLbl='Verdict'; vHead='Keep practicing'; vMsg='Good start — now go back through the flagged modules, re-read the analogy and the one-liner, and run this round again.'; }

  let h='<div class="eyebrow">◎ Round complete · '+mock.label+'</div>';
  h+='<div class="verdict '+vClass+'"><div class="vlbl">'+vLbl+'</div><h2>'+vHead+'</h2>';
  h+='<div class="score-big">'+pct+'%</div><p style="margin-top:6px">'+vMsg+'</p></div>';

  h+='<div class="mock-counts">';
  h+='<div class="mcount"><div class="mnum" style="color:#2E5E3C">'+nailed+'</div><div class="mlab">Nailed</div></div>';
  h+='<div class="mcount"><div class="mnum" style="color:#8A6D1F">'+partial+'</div><div class="mlab">Partial</div></div>';
  h+='<div class="mcount"><div class="mnum" style="color:#A34E3F">'+missed+'</div><div class="mlab">Missed</div></div>';
  h+='</div>';

  // per-track breakdown
  const tracks=[]; r.forEach(x=>{ if(!tracks.includes(x.track)) tracks.push(x.track); });
  h+='<div class="breakdown"><h4>How you did by track</h4>';
  tracks.forEach(tid=>{
    const rows=r.filter(x=>x.track===tid);
    const tn=rows[0].trackName;
    const s=rows.filter(x=>x.rating==='nailed').length + 0.5*rows.filter(x=>x.rating==='partial').length;
    const tp=Math.round(s/rows.length*100);
    const col= tp>=85?'linear-gradient(90deg,#3E7C4F,#0F6B5C)': tp>=60?'linear-gradient(90deg,#B08D57,#C9A227)':'linear-gradient(90deg,#A34E3F,#7A3B30)';
    h+='<div class="brow"><span class="bt">'+tn+'</span><span class="bbar"><span style="width:'+tp+'%;background:'+col+'"></span></span><span class="bn">'+tp+'%</span></div>';
  });
  h+='</div>';

  // weak modules to review (unique, in course order)
  const weakIds=[]; r.forEach(x=>{ if(x.rating!=='nailed' && !weakIds.includes(x.id)) weakIds.push(x.id); });
  if(weakIds.length){
    const ordered=orderedMods().filter(m=>weakIds.includes(m.id));
    h+='<div class="tracklbl" style="margin-top:22px">Review these modules</div><div class="weak-chips">';
    ordered.forEach(m=>{ h+='<button class="wchip" data-go="'+m.id+'">'+numOf(m)+' · '+m.title+'</button>'; });
    h+='</div>';
  } else {
    h+='<div class="analogy-box" style="margin-top:20px"><div class="albl">Clean sweep</div>You nailed every question in this round. Try the Full Gauntlet or a harder track focus to keep the edge.</div>';
  }

  h+='<div class="footnav"><button class="btn" data-go="mock">← New round</button>';
  h+='<button class="btn primary" data-mock-retry>Retry this round →</button></div>';
  content.innerHTML=h;
  window.scrollTo({top:0,behavior:'instant'});
}

// Mock-specific event handling (separate listener, only acts on data-mock-* attributes)
document.addEventListener('click', e=>{
  const start=e.target.closest('[data-mock-start]');
  if(start){ startMock(start.dataset.mockStart); return; }
  const trk=e.target.closest('[data-mock-track]');
  if(trk){ startMock('track', trk.dataset.mockTrack); return; }
  const rev=e.target.closest('[data-mock-reveal]');
  if(rev){ mock.revealed=true; renderMockQuestion(); return; }
  const rate=e.target.closest('[data-mock-rate]');
  if(rate){ rateAndAdvance(rate.dataset.mockRate); return; }
  const exit=e.target.closest('[data-mock-exit]');
  if(exit){ if(mock.results.length) renderMockResults(); else go('mock'); return; }
  const retry=e.target.closest('[data-mock-retry]');
  if(retry){ startMock(mock.mode, mock.trackId); return; }
});
</script>
